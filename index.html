function adminPayments() {
  const verify = DB.orders.filter((o) => o.status === 'pending_wave_admin');
  const waiting = DB.orders.filter((o) => o.status === 'pending_payment');
  const topups = pendingReqs().filter((r) => r.type === 'topup');
  const outs = pendingReqs().filter((r) => r.type === 'withdrawal');
  return `
    <div class="h-title">Paiements Wave</div>
    ${topups.length ? `<section>
      <h2 class="mb-1 text-base font-extrabold">Règlements de solde (${topups.length})</h2>
      <p class="mb-3 text-sm text-mute">Retrouvez la référence et le montant exact dans Wave Business avant de créditer.</p>
      <div class="space-y-3">${topups.map((r) => adminReqCard(r, `<div class="grid grid-cols-2 gap-2"><button class="btn btn-primary text-[13px]" data-action="wr-topup-ok" data-id="${r.id}">${ic('check', 'h-4 w-4')} Créditer</button><button class="btn btn-danger text-[13px]" data-action="wr-refuse" data-id="${r.id}">${ic('x', 'h-4 w-4')} Refuser</button></div>`)).join('')}</div>
    </section>` : ''}
    ${outs.length ? `<section>
      <h2 class="mb-1 text-base font-extrabold">Retraits à payer (${outs.length})</h2>
      <p class="mb-3 text-sm text-mute">Envoyez l'argent depuis Wave Business, puis saisissez la référence de l'envoi.</p>
      <div class="space-y-3">${outs.map((r) => adminReqCard(r, `<div class="grid grid-cols-2 gap-2"><button class="btn btn-primary text-[13px]" data-action="wr-paid" data-id="${r.id}">${ic('check', 'h-4 w-4')} Envoyé</button><button class="btn btn-danger text-[13px]" data-action="wr-refuse" data-id="${r.id}">${ic('x', 'h-4 w-4')} Refuser</button></div>`)).join('')}</div>
    </section>` : ''}
    ${!DB.settings.manualValidation ? `<div class="flex gap-2 rounded-2xl bg-rose-50 p-3.5 text-sm font-semibold text-rose-700">${ic('alert', 'h-4 w-4 mt-0.5')}La vérification des paiements est coupée (mode démo) : des fonds peuvent être bloqués sans paiement réel.</div>` : ''}
    <section>
      <h2 class="mb-1 text-base font-extrabold">À vérifier (${verify.length})</h2>
      <p class="mb-3 text-sm text-mute">Le client a déclaré avoir payé. Retrouvez la référence et le montant exact dans Wave Business.</p>
      <div class="space-y-3">${verify.length ? verify.map((o) => adminMini(o, `
        <div class="rounded-xl bg-orange-50 px-3 py-2 text-sm text-orange-800">Référence déclarée : <b>${esc(o.waveRef || 'aucune')}</b>, montant attendu <b>${fcfa(o.total)}</b></div>
        <div class="grid grid-cols-2 gap-2">
          <button class="btn btn-primary text-[13px]" data-action="admin-validate" data-id="${o.id}">${ic('check', 'h-4 w-4')} Valider</button>
          <button class="btn btn-danger text-[13px]" data-action="admin-refuse" data-id="${o.id}">${ic('x', 'h-4 w-4')} Référence invalide</button>
        </div>`)).join('') : '<div class="card p-5 text-center text-sm text-mute">Rien à vérifier.</div>'}</div>
    </section>
    <section>
      <h2 class="mb-1 text-base font-extrabold">Liens non payés (${waiting.length})</h2>
      <p class="mb-3 text-sm text-mute">Ils expirent seuls après 48 h. Si un client a payé sans passer par le lien, validez son paiement ici.</p>
      <div class="space-y-3">${waiting.length ? waiting.map((o) => adminMini(o, `<button class="btn btn-line w-full text-[13px]" data-action="admin-manual" data-id="${o.id}">${ic('handCoins', 'h-4 w-4')} Valider un paiement reçu</button>`)).join('') : '<div class="card p-5 text-center text-sm text-mute">Aucun lien en attente.</div>'}</div>
    </section>`;
}

function adminDisputeCount() {
  return DB.orders.filter((o) => o.status === 'problem' || (o.dispute && o.dispute.status === 'contested') || (o.status === 'absent_countdown' && o.absentContest) || o.status === 'refusal_pending' || isLate(o) || (o.codeLocked && !FINAL.includes(o.status)) || o.returnLocked || (o.reports || []).some((r) => r.open)).length + DB.refunds.filter((r) => r.status === 'pending').length;
}

function adminRefunds() {
  const contested = DB.orders.filter((o) => o.dispute && o.dispute.status === 'contested');
  const openDisputes = DB.orders.filter((o) => o.dispute && o.dispute.status === 'open');
  const absences = DB.orders.filter((o) => o.status === 'absent_countdown' && o.absentContest);
  const refusals = DB.orders.filter((o) => o.status === 'refusal_pending');
  const late = DB.orders.filter((o) => isLate(o));
  const locked = DB.orders.filter((o) => (o.codeLocked && !FINAL.includes(o.status)) || o.returnLocked);
  const reports = DB.orders.filter((o) => (o.reports || []).some((r) => r.open));
  const problems = DB.orders.filter((o) => o.status === 'problem' && o.problem);
  const sec = (title, desc, items) => items ? `<section><h2 class="mb-1 text-base font-extrabold">${title}</h2>${desc ? `<p class="mb-3 text-sm text-mute">${desc}</p>` : ''}<div class="space-y-3">${items}</div></section>` : '';
  const photos = (list) => `<div class="no-scrollbar -mx-1 flex gap-2 overflow-x-auto px-1">${list.filter((x) => x[0]).map(([r, l]) => `<figure class="w-[42%] shrink-0"><img src="${imgSrc(r)}" class="aspect-[4/3] w-full rounded-xl object-cover" alt=""><figcaption class="mt-1 text-[11px] text-mute">${l}</figcaption></figure>`).join('')}</div>`;
  return `
    <div class="h-title">Litiges et remboursements</div>
    ${sec(`Problèmes « Mon livreur » (${problems.length})`, 'Le client signale un problème, le paiement est bloqué. Écoutez les deux parties puis tranchez.', problems.map((o) => adminMini(o, `
      ${photos(itemsOf(o).map((it) => [it.photo, 'Photo du vendeur']).concat([[o.problem.photo, 'Photo du client']]))}
      <div class="rounded-xl bg-rose-50 px-3 py-2 text-[13px]"><b>Client :</b> ${esc(o.problem.note)}</div>
      <div class="grid gap-2">
        <button class="btn btn-line text-[13px]" data-action="pb-resolve" data-how="item" data-id="${o.id}">Rembourser l'article (${fcfa(o.price)}), livraison au vendeur</button>
        <button class="btn btn-line text-[13px]" data-action="pb-resolve" data-how="all" data-id="${o.id}">Rembourser tout (${fcfa(o.price + o.fee)})</button>
        <button class="btn btn-night text-[13px]" data-action="pb-resolve" data-how="seller" data-id="${o.id}">Payer le vendeur (${fcfa(o.price + o.fee)})</button>
      </div>`)).join(''))}
    ${sec(`Litiges à trancher (${contested.length})`, 'Le client a refusé l\'article, le vendeur conteste. Comparez les photos.', contested.map((o) => adminMini(o, `
      ${photos([[o.photo, 'Photo du vendeur'], [o.pickupPhoto, 'À la récupération'], [o.dispute.photo, 'Au refus'], [o.dispute.sellerPhoto, 'Ajoutée par le vendeur']])}
      <div class="rounded-xl bg-rose-50 px-3 py-2 text-[13px]"><b>Client :</b> ${esc(o.dispute.note)}</div>
      <div class="rounded-xl bg-surface px-3 py-2 text-[13px]"><b>Vendeur :</b> ${esc(o.dispute.sellerNote || '')}</div>
      <div class="grid grid-cols-2 gap-2">
        <button class="btn btn-line text-[13px]" data-action="admin-dispute" data-w="client" data-id="${o.id}">Raison au client</button>
        <button class="btn btn-night text-[13px]" data-action="admin-dispute" data-w="seller" data-id="${o.id}">Raison au vendeur</button>
      </div>`)).join('') || '')}
    ${sec(`Absences contestées (${absences.length})`, 'Le livreur déclare le client absent, le client dit ne voir personne.', absences.map((o) => adminMini(o, `
      <div class="grid grid-cols-2 gap-2 text-[13px]">
        <div class="rounded-xl bg-surface px-3 py-2"><div class="text-[11px] text-mute">Position du livreur</div><b>${o.arrival && !o.arrival.none ? (o.arrival.dist != null ? fmtDist(o.arrival.dist) + ' du client' : 'enregistrée (client sans GPS)') : 'indisponible'}</b></div>
        <div class="rounded-xl bg-surface px-3 py-2"><div class="text-[11px] text-mute">Appels au client</div><b>${callsSinceArrival(o)} sur place</b></div>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <button class="btn btn-line text-[13px]" data-action="admin-absence" data-w="present" data-id="${o.id}">Livreur sur place</button>
        <button class="btn btn-danger text-[13px]" data-action="admin-absence" data-w="absent" data-id="${o.id}">Livreur absent</button>
      </div>`)).join('') || '')}
    ${sec(`Refus en attente du client (${refusals.length})`, 'Si le client confirme par téléphone, validez pour lui.', refusals.map((o) => adminMini(o, `
      <div class="rounded-xl bg-rose-50 px-3 py-2 text-[13px]">${esc(o.refusal ? o.refusal.note : '')}</div>
      <button class="btn btn-line w-full text-[13px]" data-action="admin-confirm-refusal" data-id="${o.id}">Le client confirme au téléphone</button>`)).join('') || '')}
    ${sec(`Livraisons en retard (${late.length})`, 'Plus de 3 h depuis la récupération du colis.', late.map((o) => adminMini(o, `
      <div class="text-[13px] text-mute">Livreur : <b class="text-ink">${esc(o.driverName || '')}</b>, colis récupéré ${fmtTime(o.pickedAt)}</div>
      <div class="grid grid-cols-2 gap-2">
        ${o.status === 'return_to_seller' ? `<button class="btn btn-line text-[13px]" data-action="admin-force-return" data-id="${o.id}">Retour confirmé</button>` : '<span></span>'}
        <button class="btn btn-danger text-[13px]" data-action="admin-lost" data-id="${o.id}">Déclarer perdu</button>
      </div>`)).join('') || '')}
    ${sec(`Signalements clients (${reports.length})`, '', reports.map((o) => adminMini(o, `
      ${(o.reports || []).filter((r) => r.open).map((r) => `<div class="rounded-xl bg-amber-50 px-3 py-2 text-[13px]">${esc(r.note)}<div class="text-[11px] text-mute">${fmtTime(r.at)}</div></div>`).join('')}
      <button class="btn btn-line w-full text-[13px]" data-action="report-close" data-id="${o.id}">Marquer comme traité</button>`)).join('') || '')}
    ${sec(`Codes bloqués (${locked.length})`, '', locked.map((o) => adminMini(o, `<p class="text-sm text-rose-700">Trop de codes incorrects. Appelez le client et le livreur avant de débloquer.</p><button class="btn btn-line w-full text-[13px]" data-action="unlock-code" data-id="${o.id}">${ic('lockOpen', 'h-4 w-4')} Débloquer la saisie</button>`)).join('') || '')}
    ${openDisputes.length ? sec(`Refus en attente du vendeur (${openDisputes.length})`, 'Sans réponse sous 24 h, le client a raison automatiquement.', openDisputes.map((o) => adminMini(o, `<div class="text-[13px] text-mute">Fin du délai : <b class="text-ink">${fmtTime(new Date(o.dispute.deadline).toISOString())}</b></div>`)).join('')) : ''}
    <section>
      <h2 class="mb-1 text-base font-extrabold">Remboursements clients</h2>
      <p class="mb-3 text-sm text-mute">Envoyez le montant sur le Wave du client, puis marquez-le comme remboursé.</p>
      <div class="space-y-3">${DB.refunds.length ? DB.refunds.map((r) => { const o = getOrder(r.orderId); return `
        <div class="card space-y-3 p-4 ${r.status === 'pending' ? 'ring-2 ring-ci/40' : ''}">
          <div class="flex justify-between gap-3"><div class="min-w-0"><div class="truncate font-bold">${o ? esc(o.name) : r.orderId}</div><div class="text-xs text-mute">${esc(r.reason)}</div><div class="mt-1 text-sm">Vers <b>${prettyPhone(r.to)}</b>${o && o.client && o.client.email ? `<span class="block truncate text-xs text-mute">${esc(o.client.email)}</span>` : ''}</div></div><div class="amount whitespace-nowrap">${fcfa(r.amount)}</div></div>
          ${r.status === 'pending' ? `<button class="btn btn-night w-full text-[13px]" data-action="refund-done" data-id="${r.id}">${ic('send', 'h-4 w-4')} Transfert Wave fait : marquer remboursé</button>` : `<div class="flex items-center gap-1.5 text-sm font-semibold text-emerald-700">${ic('circleCheck', 'h-4 w-4')} Remboursé le ${fmtTime(r.doneAt)}${r.ref ? ', réf. ' + esc(r.ref) : ''}</div>`}
        </div>`; }).join('') : '<div class="card p-5 text-center text-sm text-mute">Aucun remboursement.</div>'}</div>
    </section>`;
}

      ${(DB.waOutbox || []).slice(0, 12).map((m) => `<div class="rounded-xl bg-surface p-2.5 text-xs"><div class="flex justify-between gap-2 font-bold"><span>${prettyPhone(m.to)}</span><span class="font-normal text-mute">${fmtTime(m.at)}</span></div><div class="mt-1 line-clamp-3 whitespace-pre-line text-mute">${esc(m.text)}</div></div>`).join('') || '<div class="text-xs text-mute">Aucun message pour l\'instant.</div>'}
    </section>
    <section class="card space-y-3 p-4">

      <p class="text-xs text-mute">Paiement automatique : ${WAVE_CHECKOUT_ENDPOINT ? 'serveur Wave Checkout branché.' : 'non branché. Renseignez WAVE_CHECKOUT_ENDPOINT (votre serveur) dans le fichier.'}</p>

/* ---------- Vérification d'identité ---------- */
function kycBanner(u) {
  if (kycStatus(u) === 'suspended') return `<div class="flex gap-3 rounded-2xl bg-rose-50 p-4 text-sm ring-1 ring-rose-200">${ic('shieldAlert', 'h-5 w-5 text-rose-600')}<div><div class="font-bold text-rose-800">Compte suspendu</div><div class="text-rose-700">${esc(u.kyc.reason || '')}. Contactez SûrPay.</div></div></div>`;
  if (u.role === 'admin' || kycStatus(u) !== 'pending') return '';
  return `
    <div class="flex gap-3 rounded-2xl bg-amber-50 p-4 text-sm ring-1 ring-amber-200">
      <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-amber-100 text-amber-700">${ic('hourglass')}</span>
      <div>
        <div class="font-bold text-amber-900">Vérification de votre identité en cours</div>
        <div class="mt-0.5 text-amber-800">L'équipe SûrPay contrôle vos documents, en général sous 24 h. ${u.role === 'seller' ? 'Vous pourrez créer des liens dès la validation.' : 'Vous pourrez accepter des courses dès la validation.'}</div>
        ${DEMO_MODE ? '<div class="mt-1.5 text-xs text-amber-700">Démo : connectez-vous avec le compte Admin pour valider.</div>' : ''}
      </div>
    </div>`;
}

function pendingLock(title, what) {
  return `
    <div class="h-title">${title}</div>
    <div class="card p-6 text-center">
      <span class="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-amber-50 text-amber-600">${ic('hourglass', 'h-7 w-7')}</span>
      <div class="mt-3 text-lg font-extrabold">Identité en cours de vérification</div>
      <p class="mt-1 text-sm text-mute">Vous pourrez ${what} dès que l'équipe SûrPay aura validé vos documents.</p>
    </div>`;
}

function kycNav(nextLabel, nextAction, disabled) {
  return `<div class="grid grid-cols-[auto_1fr] gap-3">
    <button class="btn btn-line px-4" data-action="kyc-back" aria-label="Étape précédente">${ic('arrowLeft')}</button>
    <button class="btn btn-primary btn-lg" data-action="${nextAction}" ${disabled ? 'disabled' : ''}>${nextLabel}</button>
  </div>`;
}

function renderKyc() {
  const u = me(); const k = u.kyc; const step = UI.kycStep || 1;
  const body = step === 1 ? kycStep1(u, k) : step === 2 ? kycStep2(u, k) : step === 3 ? kycStep3(u, k) : kycStep4(u, k);
  return `
  <div class="min-h-[100dvh] pb-10">
    <header class="weave px-5 pb-6 pt-[max(18px,env(safe-area-inset-top))] text-white">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2.5">${LOGO('h-9 w-9')}<span class="text-[17px] font-extrabold tracking-tight">SûrPay CI</span></div>
        <button class="text-sm font-semibold text-white/70 underline underline-offset-4" data-action="logout">Quitter</button>
      </div>
      <h1 class="mt-6 text-[25px] font-extrabold leading-tight tracking-tight">Vérifions votre identité</h1>
      <p class="mt-1.5 text-sm leading-relaxed text-white/75">Chaque ${u.role === 'seller' ? 'vendeur' : 'livreur'} SûrPay est vérifié. C'est ce qui permet aux clients de payer en confiance.</p>
      <ol class="mt-5 grid grid-cols-4 gap-1.5">
        ${KYC_STEPS.map((s, i) => `<li><div class="h-1.5 rounded-full ${i + 1 <= step ? 'bg-emerald-400' : 'bg-white/15'}"></div><div class="mt-1.5 text-[11.5px] font-semibold ${i + 1 === step ? 'text-white' : 'text-white/45'}">${i + 1}. ${s}</div></li>`).join('')}
      </ol>
    </header>
    ${k.status === 'rejected' ? `
    <div class="mx-5 mt-5 flex gap-3 rounded-2xl bg-rose-50 p-4 text-sm ring-1 ring-rose-200">
      ${ic('shieldAlert', 'h-5 w-5 text-rose-600 mt-0.5')}
      <div><div class="font-bold text-rose-800">Vérification refusée</div><div class="text-rose-700">${esc(k.reason || '')}. Corrigez puis renvoyez avec un nouveau selfie.</div></div>
    </div>` : ''}
    <main class="space-y-5 px-5 pt-5">${body}</main>
  </div>`;
}

function phoneField(id, model, value, placeholder) {
  return `<div class="relative"><span class="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-[15px] font-semibold text-mute">+225</span><input id="${id}" class="field pl-16" type="tel" inputmode="tel" data-kyc="${model}" value="${esc(value || '')}" placeholder="${placeholder}"></div>`;
}

function kycStep1(u, k) {
  return `

      <h2 class="font-extrabold">Vos informations</h2>
      <div><label class="lbl" for="k-name">Nom complet, comme sur votre document</label><input id="k-name" class="field" data-kyc="fullName" value="${esc(k.fullName ?? u.name)}" autocomplete="name"></div>

      <div><label class="lbl" for="k-wave">Numéro Wave pour vos retraits</label>${phoneField('k-wave', 'wave', k.wave, 'Vide si c\'est le même')}</div>
    </section>
    ${u.role === 'seller' ? `
    <section class="card space-y-4 p-4">
      <h2 class="font-extrabold">Votre boutique</h2>
      <div><label class="lbl" for="k-shop">Nom affiché aux clients</label><input id="k-shop" class="field" data-kyc="shopName" value="${esc(k.shopName || '')}" placeholder="Ex : Aïcha Wax Shop" maxlength="40"></div>
    </section>` : `
    <section class="card space-y-4 p-4">
      <h2 class="font-extrabold">Vos engins</h2>

function stopTracks() {
  if (CAM.stream) CAM.stream.getTracks().forEach((t) => t.stop());
  CAM.stream = null;
}

async function startStream() {
  stopTracks();
  const p = CAM.opts;
  const loading = $('#cam-loading'); if (loading) loading.classList.remove('hidden');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return camError('insecure');
  try {
    const big = p.max > 1000;
    CAM.stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: CAM.facing }, width: { ideal: big ? 1920 : 1280 }, height: { ideal: big ? 1440 : 960 } } });
    const v = $('#cam-video');
    if (!v) { stopTracks(); return; }
    v.srcObject = CAM.stream;
    v.style.transform = CAM.facing === 'user' ? 'scaleX(-1)' : '';
    try { await v.play(); } catch (e) {}
    if ($('#cam-loading')) $('#cam-loading').classList.add('hidden');
    $('#cam-shot').disabled = false;
    const track = CAM.stream.getVideoTracks()[0];
    const caps = track && track.getCapabilities ? track.getCapabilities() : {};
    const t = $('#cam-torch'); if (t) t.classList.toggle('invisible', !caps.torch);
    $('#cam-msg').innerHTML = camHint();
  } catch (e) { camError(e && e.name); }
}

function camError(name) {

function analyzeCanvas(src) {
  const w = 160, h = Math.max(1, Math.round(src.height * w / src.width));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); x.drawImage(src, 0, 0, w, h);
  const d = x.getImageData(0, 0, w, h).data;
  const g = new Float32Array(w * h); let sum = 0;
  for (let i = 0; i < w * h; i++) { const v = 0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2]; g[i] = v; sum += v; }
  let ls = 0, lq = 0, n = 0;
  for (let yy = 1; yy < h - 1; yy++) for (let xx = 1; xx < w - 1; xx++) {
    const i = yy * w + xx; const l = 4 * g[i] - g[i - 1] - g[i + 1] - g[i - w] - g[i + w];
    ls += l; lq += l * l; n++;
  }
  const mean = sum / (w * h), sharp = n ? lq / n - (ls / n) ** 2 : 0;
  return { dark: mean < 55, bright: mean > 230, blurry: sharp < 25 };
}

function showReview(data, mode, quality) {
  CAM.shot = data; CAM.mode = mode; CAM.quality = quality;
  const img = $('#cam-review'); img.src = data; img.classList.remove('hidden');
  $('#cam-live').classList.add('hidden');
  $('#cam-ctrl-live').classList.add('hidden');
  $('#cam-ctrl-review').classList.remove('hidden'); $('#cam-ctrl-review').classList.add('grid');
  const issues = [];
  if (quality && quality.blurry) issues.push('la photo semble floue');
  if (quality && quality.dark) issues.push('elle est trop sombre');
  if (quality && quality.bright) issues.push('elle est trop claire');
  const m = $('#cam-msg'); m.classList.remove('hidden');
  m.innerHTML = issues.length
    ? `<span class="font-bold text-amber-300">Attention :</span> ${issues.join(', ')}. Reprenez-la pour qu'elle soit bien lisible.`
    : mode === 'demo' ? 'Image de test générée (mode démo).' : 'Vérifiez que tout est net et lisible.';
}

function camRetake() {
  CAM.shot = null;
  $('#cam-review').classList.add('hidden');
  $('#cam-live').classList.remove('hidden');
  $('#cam-ctrl-review').classList.add('hidden'); $('#cam-ctrl-review').classList.remove('grid');
  $('#cam-ctrl-live').classList.remove('hidden');
  const err = $('#cam-error');
  if (!CAM.stream && !err) startStream();
  $('#cam-msg').innerHTML = camHint();
  if (err) $('#cam-msg').classList.add('hidden');
}

function captureFrame() {
  const v = $('#cam-video');
  if (!v || !v.videoWidth) return toast('La caméra n\'est pas encore prête.', 'warn');
  const p = CAM.opts;
  let sw = v.videoWidth, sh = v.videoHeight, sx = 0, sy = 0;
  if (sw / sh > p.ratio) { const w = sh * p.ratio; sx = (sw - w) / 2; sw = w; } else { const h = sw / p.ratio; sy = (sh - h) / 2; sh = h; }
  const k = Math.min(1, p.max / Math.max(sw, sh));
  const c = document.createElement('canvas');
  c.width = Math.round(sw * k); c.height = Math.round(sh * k);
  c.getContext('2d').drawImage(v, sx, sy, sw, sh, 0, 0, c.width, c.height);
  buzz(12);
  const f = $('#cam-flash'); if (f) { f.classList.remove('flash'); void f.offsetWidth; f.classList.add('flash'); }
  showReview(c.toDataURL('image/jpeg', p.q), 'live', analyzeCanvas(c));
}

function demoImage() {
  const p = CAM.opts;
  const W = p.ratio >= 1 ? 900 : 600, H = Math.round(W / p.ratio);
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, W, H); g.addColorStop(0, '#12305A'); g.addColorStop(1, '#0A1F3D');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  x.fillStyle = 'rgba(255,255,255,.18)';
  if (p.shape === 'oval') { x.beginPath(); x.arc(W / 2, H * 0.4, W * 0.2, 0, Math.PI * 2); x.fill(); x.beginPath(); x.ellipse(W / 2, H * 0.98, W * 0.38, H * 0.3, 0, 0, Math.PI * 2); x.fill(); }
  else if (p.shape === 'card') { x.fillRect(W * 0.06, H * 0.12, W * 0.26, H * 0.5); for (let i = 0; i < 5; i++) x.fillRect(W * 0.38, H * (0.16 + i * 0.12), W * (0.5 - i * 0.05), H * 0.05); }
  else { x.fillRect(W * 0.25, H * 0.25, W * 0.5, H * 0.5); }
  x.fillStyle = '#F77F00'; x.font = `800 ${Math.round(W / 14)}px sans-serif`; x.textAlign = 'center';
  x.fillText('IMAGE DE TEST', W / 2, H - H * 0.08);
  return c.toDataURL('image/jpeg', 0.8);
}

function applyShot(target, data, mode) {

  } else if (target.startsWith('sheet:')) {

async function toggleTorch() {

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const fn = A[el.dataset.action];
  if (fn) { e.preventDefault(); fn(el); }
});

document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.dataset.model) {
    UI.form[t.dataset.model] = t.value;
    if (['price', 'fee', 'qty', 'pickup', 'location', 'name'].includes(t.dataset.model)) { const c = $('#calc'); if (c) c.innerHTML = calcHTML(); }
  }
  if (t.dataset.search) { UI.search = t.value; const l = $('#order-list'); const u = me(); if (l && u) l.innerHTML = sellerOrderCards(u); }
  if (t.dataset.kyc) { const u = me(); if (u && u.kyc) u.kyc[t.dataset.kyc] = t.type === 'checkbox' ? t.checked : t.value; }
  if (t.dataset.vehPlate) {
    const u = me(); const src = t.dataset.mode === 'draft' ? UI.vehDraft : u && u.kyc;
    if (src) { if (t.dataset.mode !== 'draft') vehMigrate(src); src.plates = src.plates || {}; src.plates[t.dataset.vehPlate] = t.value; }
  }
  if (t.dataset.draft && UI.clientId) {
    UI.clientDraft[UI.clientId] = UI.clientDraft[UI.clientId] || { wa: '', email: '', hint: '' };
    UI.clientDraft[UI.clientId][t.dataset.draft] = t.value;
  }
});

document.addEventListener('change', async (e) => {
  const t = e.target;
  if (t.id === 'client-switch') { openClientPortal(t.value); return; }
  if (t.dataset.camgallery) {
    const f = t.files && t.files[0]; if (!f) return;
    try {
      const data = await readPhoto(f, CAM.opts.max, CAM.opts.q);
      const img = new Image(); img.src = data; await img.decode().catch(() => {});
      const e = $('#cam-error'); if (e) e.remove();
      stopTracks(); showReview(data, 'gallery', img.width ? analyzeCanvas(img) : null);
    } catch (err) { toast(err.message, 'error'); }
    return;
  }
  if (t.dataset.photo) {
    const f = t.files && t.files[0]; if (!f) return;
    try {
      const data = await readPhoto(f, t.dataset.photo === 'form' ? 1000 : 800, t.dataset.photo === 'form' ? 0.8 : 0.72);
      if (t.dataset.photo === 'form') { UI.form.photo = data; render(); }
      else { UI.sheetPhoto = data; const p = $('#sheet-photo-preview'); if (p) { p.src = data; p.classList.remove('hidden'); } }
    } catch (err) { toast(err.message, 'error'); }
  }
});

function syncCountdowns() {
  document.querySelectorAll('[data-countdown]').forEach((n) => { const o = getOrder(n.dataset.countdown); if (o && o.absentDeadline) n.textContent = mmss(o.absentDeadline - Date.now()); });
}

setInterval(() => {
  if (runTimers()) {
    save();
    if (!document.querySelector('#sheet-root > *') && !document.querySelector('#cam-root > *')) render();
  } else syncCountdowns();
}, 1000);

window.addEventListener('storage', (e) => {
  if ([DB_KEY, VAULT_KEY].includes(e.key)) {
    DB = loadDB(); VAULT = loadVault();
    imgLoadMissing().then(() => { if (!document.querySelector('#sheet-root > *') && !document.querySelector('#cam-root > *')) render(); });
    const fresh = myNotifs().filter((n) => !n.read && n.at > UI.lastNotifAt);
    if (fresh.length) { UI.lastNotifAt = fresh[0].at; toast(fresh[0].title + ' : ' + fresh[0].body, 'info'); }
    if (!document.querySelector('#sheet-root > *') && !document.querySelector('#cam-root > *')) render();
  }
});
window.addEventListener('hashchange', () => {
  const m = location.hash.match(/^#\/pay\/([A-Z0-9]+)/i);
  if (m && (UI.screen !== 'client' || UI.clientId !== m[1].toUpperCase())) openClientPortal(m[1].toUpperCase());
  const v = location.hash.match(/^#\/v\/([\w-]+)/);
  if (v && (UI.screen !== 'shop' || UI.shopId !== v[1])) openShop(v[1]);
  if (/^#\/(cgu|confidentialite)/.test(location.hash) && UI.screen !== 'legal') openLegal(location.hash.includes('confidentialite') ? 'privacy' : 'cgu');
});

/* =====================================================================
   DÉMARRAGE
   ===================================================================== */
(async function boot() {
  const msg = $('#boot-msg');
  const t0 = Date.now();
  setTimeout(() => { if (msg) msg.textContent = 'Chargement de vos commandes…'; }, 700);
  try {
    IMG.db = await idbOpen();
    await imgLoadMissing();
    migrateJournal();
    await initFirebase();
    runTimers(); // délais expirés pendant que l'app était fermée
    save();
  } catch (e) { console.error(e); }
  const wait = Math.max(0, 1800 - (Date.now() - t0));
  setTimeout(() => {
    try {
      const m = location.hash.match(/^#\/pay\/([A-Z0-9]+)(\/wave)?/i);
      const v = location.hash.match(/^#\/v\/([\w-]+)/);
      const lg = location.hash.match(/^#\/(cgu|confidentialite)/);
      if (m) { UI.clientId = m[1].toUpperCase(); UI.screen = 'client'; render(); if (m[2]) { const o = getOrder(UI.clientId); if (o) checkWaveReturn(o); } }
      else if (v) { UI.shopId = v[1]; UI.screen = 'shop'; render(); }
      else if (lg) { UI.legal = lg[1] === 'cgu' ? 'cgu' : 'privacy'; UI.legalFrom = null; UI.screen = 'legal'; render(); }
      else {
        const t = (location.hash.match(/^#\/app\/(\w+)/) || [])[1];
        if (t) UI.tab = t;
        goHome();
      }
      if (!STORE.ok) setTimeout(() => toast('Aperçu intégré : rien ne sera conservé à la fermeture. Ouvrez le fichier dans Chrome pour garder vos données.', 'warn'), 400);
    } catch (err) {
      console.error(err);
      $('#app').innerHTML = `<div class="p-6"><div class="card p-5 text-sm text-rose-700"><b>Erreur au démarrage :</b> ${esc(err.message)}</div></div>`;
    }
  }, wait);
})();
window.addEventListener('error', (e) => { try { toast('Erreur : ' + (e.message || 'inconnue'), 'error'); } catch (x) {} });
/* App installable : le service worker garde une copie pour ouvrir l'app même avec un réseau faible */
try { if ('serviceWorker' in navigator && location.protocol === 'https:' && window.top === window.self) navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
</script>
</body>
