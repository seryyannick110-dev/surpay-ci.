function networkFee(f) {
  const sz = sizeOf(f); const t = tariff();
  const fc = communeOf(f.pickup), tc = communeOf(f.location);
  const from = f.pickupGeo || (fc ? { lat: COMMUNES[fc][0], lng: COMMUNES[fc][1] } : null);
  const to = tc ? { lat: COMMUNES[tc][0], lng: COMMUNES[tc][1] } : null;
  if (!from || !to) return null;
  const km = Math.max(1, Math.round((distM(from, to) / 1000) * 1.3));
  let fee = t.base + t.perKm * Math.min(km, t.farFrom) + t.perKmFar * Math.max(0, km - t.farFrom);
  fee = Math.min(t.max, Math.round(fee / 100) * 100);
  const extra = sz ? (sz.id === 'medium' ? t.medium : sz.id === 'large' ? t.large : 0) : 0;
  return { km, fee: fee + extra, base: fee, extra, from: fc || 'votre position', to: tc };
}

/* FileReader + compression (les photos restent légères dans le stockage) */
function readPhoto(file, max = 1000, q = 0.8) {
  return new Promise((resolve, reject) => {
    if (!file || !file.type.startsWith('image/')) return reject(new Error('Ce fichier n\'est pas une image.'));
    const r = new FileReader();
    r.onerror = () => reject(new Error('Lecture de la photo impossible.'));
    r.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Photo illisible.'));
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', q));
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

  const [bg, i] = map[type] || map.info;

  el.className = `toast-in pointer-events-auto flex w-full items-start gap-2.5 rounded-2xl ${bg} px-4 py-3 text-sm font-semibold text-white shadow-2xl`;
  el.innerHTML = ic(i, 'h-5 w-5 mt-px') + `<span>${esc(msg)}</span>`;
  if (type === 'success') buzz(12); else if (type === 'error') buzz([25, 40, 25]);
  const box = $('#toasts');

  box.appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .3s, transform .3s'; el.style.opacity = '0'; el.style.transform = 'translateY(-8px)'; }, 2800);
  setTimeout(() => el.remove(), 3200);
}

/* =====================================================================
   AUTHENTIFICATION (Firebase Google, ou démo)
   ===================================================================== */
let FB = null;

async function initFirebase() {
  if (!FIREBASE_CONFIG.apiKey) return false;
  try {
    const appMod = await import(FIREBASE_SDK + 'firebase-app.js');
    const authMod = await import(FIREBASE_SDK + 'firebase-auth.js');
    const app = appMod.initializeApp(FIREBASE_CONFIG);
    const auth = authMod.getAuth(app);
    auth.languageCode = 'fr';
    try { await authMod.setPersistence(auth, authMod.browserLocalPersistence); } catch (e) {}
    FB = { auth, m: authMod };
    try {
      const res = await authMod.getRedirectResult(auth);
      if (res && res.user) onFirebaseUser(res.user, true);
    } catch (e) { toast(authErrorText(e), 'error'); }
    authMod.onAuthStateChanged(auth, (u) => {
      if (u && SESSION !== u.uid && UI.screen !== 'client') onFirebaseUser(u, false);
    });
    return true;
  } catch (e) {
    console.warn('Firebase indisponible', e);
    FB = null;
    return false;
  }
}

function authErrorText(e) {
  const c = (e && e.code) || '';
  if (c === 'auth/unauthorized-domain') return 'Ce domaine n\'est pas autorisé dans Firebase (Authentication → Settings → Authorized domains).';
  if (c === 'auth/popup-closed-by-user' || c === 'auth/cancelled-popup-request') return 'Connexion annulée.';
  if (c === 'auth/network-request-failed') return 'Pas de connexion internet. Réessayez.';
  if (c === 'auth/operation-not-supported-in-this-environment' || c === 'auth/unauthorized-domain') return 'La connexion Google ne marche que sur le site en ligne (adresse autorisée dans Firebase). En attendant, utilisez un compte de démo.';
  if (c === 'auth/operation-not-allowed') return 'Activez le fournisseur Google dans Firebase Authentication.';
  return 'Connexion Google impossible (' + (c || 'erreur inconnue') + ').';
}

async function googleSignIn() {
  if (!FB) { openAccountPicker(); return; }
  const { auth, m } = FB;
  const provider = new m.GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });
  if (isInAppBrowser()) {
    toast('Navigateur intégré détecté : redirection vers Google…', 'info');
    try { await m.signInWithRedirect(auth, provider); } catch (e) { toast(authErrorText(e), 'error'); }
    return;
  }
  try {
    const res = await m.signInWithPopup(auth, provider);
    onFirebaseUser(res.user, true);
  } catch (e) {
    if (['auth/popup-blocked', 'auth/web-storage-unsupported'].includes(e.code) && /^https?:$/.test(location.protocol)) {
      try { await m.signInWithRedirect(auth, provider); } catch (e2) { toast(authErrorText(e2), 'error'); }
    } else toast(authErrorText(e), 'error');
  }
}

function onFirebaseUser(fu, announce) {
  const tel = fu.phoneNumber ? fu.phoneNumber.replace(/^\+225/, '') : '';
  const u = ensureUser({ uid: fu.uid, name: fu.displayName || (fu.email || '').split('@')[0] || (tel ? prettyPhone(tel) : 'Utilisateur'), email: fu.email || '', photo: fu.photoURL || null, provider: tel ? 'phone' : 'google' });
  if (tel) { u.phone = tel; if (u.kyc && !u.kyc.phone) u.kyc.phone = tel; }
  signInAs(u.uid, announce);
}

function ensureUser(p) {
  let u = DB.users[p.uid];

/* =====================================================================
   IMAGES (IndexedDB : beaucoup plus de place que le localStorage)
   ===================================================================== */
const IMG = { cache: {}, db: null };
const BLANK_IMG = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
function idbOpen() {
  return new Promise((res) => {
    try {
      const r = indexedDB.open('surpay_ci_images', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('img');
      r.onsuccess = () => res(r.result);
      r.onerror = () => res(null);
    } catch (e) { res(null); }
  });
}
function imgRefs() {
  const out = [];
  DB.orders.forEach((o) => {
    out.push(o.photo, o.pickupPhoto, o.proofPhoto);
    (o.items || []).forEach((it) => out.push(it.photo));
    if (o.problem) out.push(o.problem.photo);
    if (o.refusal) out.push(o.refusal.photo);
    if (o.dispute) out.push(o.dispute.photo, o.dispute.sellerPhoto);
  });
  Object.values(DB.users).forEach((u) => { if (u.kyc) out.push(u.kyc.selfie, u.kyc.recto, u.kyc.verso); });
  return out.filter((r) => typeof r === 'string' && r.startsWith('img:'));
}
function imgLoadMissing() {
  return new Promise((res) => {
    const need = imgRefs().filter((r) => !IMG.cache[r]);
    if (!need.length || !IMG.db) return res();
    try {
      const tx = IMG.db.transaction('img', 'readonly'); const st = tx.objectStore('img');
      need.forEach((r) => { const q = st.get(r); q.onsuccess = () => { if (q.result) IMG.cache[r] = q.result; }; });
      tx.oncomplete = () => res(); tx.onerror = () => res();
    } catch (e) { res(); }
  });
}
function putImg(data) {
  if (!data || !String(data).startsWith('data:') || !IMG.db) return data || null;
  const ref = 'img:' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  IMG.cache[ref] = data;
  try { IMG.db.transaction('img', 'readwrite').objectStore('img').put(data, ref); } catch (e) {}
  return ref;
}
function imgSrc(ref) {
  if (!ref) return BLANK_IMG;
  if (String(ref).startsWith('data:')) return ref;
  return IMG.cache[ref] || BLANK_IMG;
}
function imgClear() {
  IMG.cache = {};
  try { if (IMG.db) IMG.db.transaction('img', 'readwrite').objectStore('img').clear(); } catch (e) {}
}

/* =====================================================================
   POSITION, DISTANCES ET TARIF CONSEILLÉ
   ===================================================================== */
function getPosition(timeout = 12000) {
  return new Promise((res) => {
    if (!navigator.geolocation) return res(null);
    try {
      navigator.geolocation.getCurrentPosition(
        (p) => res({ lat: +p.coords.latitude.toFixed(6), lng: +p.coords.longitude.toFixed(6), acc: Math.round(p.coords.accuracy || 0), at: nowISO() }),
        () => res(null), { enableHighAccuracy: true, timeout, maximumAge: 30000 });
    } catch (e) { res(null); }
  });
}
function deaccent(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
function communeOf(text) { const t = deaccent(text); return Object.keys(COMMUNES).find((c) => t.includes(deaccent(c))) || null; }
function distM(a, b) {
  if (!a || !b) return null;
  const R = 6371000, r = Math.PI / 180;
  const dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLng / 2) ** 2;
  return Math.round(2 * R * Math.asin(Math.sqrt(x)));
}
function fmtDist(m) { return m == null ? '—' : m < 1000 ? m + ' m' : (m / 1000).toFixed(1).replace('.', ',') + ' km'; }
function suggestFee(pickupGeo, pickupText, locationText) {
  const fc = communeOf(pickupText), tc = communeOf(locationText);
  const from = pickupGeo || (fc ? { lat: COMMUNES[fc][0], lng: COMMUNES[fc][1] } : null);
  const to = tc ? { lat: COMMUNES[tc][0], lng: COMMUNES[tc][1] } : null;
  if (!from || !to) return null;
  const km = Math.max(1, Math.round((distM(from, to) / 1000) * 1.3));
  const fee = Math.max(1000, Math.round((700 + 200 * km) / 100) * 100);
  return { km, fee, min: Math.round((fee * 0.8) / 100) * 100, from: fc || 'votre position', to: tc };
}
function mapsLink(geo, text) {
  if (geo) return `https://www.google.com/maps/dir/?api=1&destination=${geo.lat},${geo.lng}`;
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent((text || '') + ', Abidjan');
}
function slotTs(o) { return Date.parse(o.date + 'T' + (o.time || '12:00')); }

/* =====================================================================
   REGISTRE DES SOLDES (journal chaîné : toute modification à la main se voit)
   ===================================================================== */
const ACCOUNTS = ['caution', 'gains', 'wallet', 'driverCaution'];
function journalHash(prev, e) { return hashCode([prev, e.at, e.uid, e.acct, e.amount, e.orderId || ''].join('|'), 'journal'); }
function move(uid, acct, amount, label, orderId) {
  const u = DB.users[uid]; if (!u || !amount) return;
  u[acct] = (u[acct] || 0) + amount;
  const prev = DB.journal.length ? DB.journal[DB.journal.length - 1].h : '0';
  const e = { at: nowISO(), uid, acct, amount, label, orderId: orderId || null, p: prev };
  e.h = journalHash(prev, e);
  DB.journal.push(e);
  if (acct === 'gains' || acct === 'caution') u.log.unshift({ at: e.at, label, amount });
  else u.history.unshift({ at: e.at, label, amount, orderId: orderId || null });
}
function checkIntegrity() {
  let prev = '0'; const sums = {};
  for (const e of DB.journal) {
    if (e.p !== prev || e.h !== journalHash(prev, e)) return { ok: false, reason: 'Le journal des mouvements a été modifié.' };
    prev = e.h;
    sums[e.uid + ':' + e.acct] = (sums[e.uid + ':' + e.acct] || 0) + e.amount;
  }
  for (const u of Object.values(DB.users)) {
    for (const a of ACCOUNTS) {
      if ((u[a] || 0) !== (sums[u.uid + ':' + a] || 0)) return { ok: false, reason: `Le solde de ${u.name} ne correspond pas à ses mouvements.` };
    }
  }
  return { ok: true };
}
function migrateJournal() {
  if (DB.journal && DB.journal.length) return;
  DB.journal = [];
  Object.values(DB.users).forEach((u) => {
    if ((u.caution || 0) > 0) u.welcomeCaution = true;
    ACCOUNTS.forEach((a) => {
      const v = u[a] || 0; if (!v) return;
      u[a] = 0;
      const prev = DB.journal.length ? DB.journal[DB.journal.length - 1].h : '0';
      const e = { at: nowISO(), uid: u.uid, acct: a, amount: v, label: "Solde d'ouverture", orderId: null, p: prev };
      e.h = journalHash(prev, e); DB.journal.push(e); u[a] = v;
    });
  });
}

/* =====================================================================
   ACCÈS CLIENT (code de vérification envoyé sur WhatsApp)
   Le code secret de livraison n'est visible que par le client.
   ===================================================================== */
let MEM_GRANTS = {};
function readGrants() { try { return JSON.parse(sessionStorage.getItem('surpay_ci_grants') || '{}'); } catch (e) { return MEM_GRANTS; } }
function writeGrants(g) { MEM_GRANTS = g; try { sessionStorage.setItem('surpay_ci_grants', JSON.stringify(g)); } catch (e) {} }
function setGrant(id) { const g = readGrants(); g[id] = Date.now() + GRANT_TTL_MS; writeGrants(g); }
function hasGrant(id) { const t = readGrants()[id]; return !!t && t > Date.now(); }
function maskPhone(d) { return d ? '+225 ' + d.slice(0, 2) + ' •• •• •• ' + d.slice(-2) : ''; }
function requireClient(o, fn) {
  if (hasGrant(o.id)) return fn();
  UI.afterGrant = fn;
  openOtp(o);
}
function openOtp(o) {
  if (!o.client || !o.client.wa) return toast('Aucun numéro client pour cette commande.', 'error');
  const a = new Uint32Array(1); crypto.getRandomValues(a);
  const code = String(100000 + (a[0] % 900000));
  VAULT['otp:' + o.id] = { h: hashCode(code, 'otp:' + o.id), exp: Date.now() + OTP_TTL_MS, tries: 0 };
  save();
  openSheet(`
    <h2 class="text-xl font-extrabold">Confirmez que c'est bien vous</h2>
    <p class="mt-1 text-sm text-mute">Un code à 6 chiffres vient d'être envoyé sur WhatsApp au <b class="text-ink">${maskPhone(o.client.wa)}</b>, le numéro donné au paiement.</p>
    ${DEMO_MODE ? `<div class="mt-4 rounded-2xl rounded-tl-md bg-[#DCF8C6] p-3 text-sm text-[#0B3B12] shadow-sm"><div class="text-[11.5px] font-bold text-[#128C7E]">Démo : message reçu par le client</div><div class="mt-1">SûrPay CI : votre code de vérification est <b>${code}</b>. Ne le donnez à personne, pas même au livreur.</div></div>` : ''}
    <label class="lbl mt-4" for="otp-in">Code reçu</label>
    <input id="otp-in" class="field text-center text-2xl font-extrabold tracking-[.5em]" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
    <button class="btn btn-primary btn-lg mt-4 w-full" data-action="otp-verify" data-id="${o.id}">Vérifier</button>
    <button class="mt-3 w-full text-center text-sm font-semibold text-mute underline underline-offset-4" data-action="otp-resend" data-id="${o.id}">Renvoyer un code</button>`);
}

/* =====================================================================
   COMMANDES : création, paiement, livraison, retours, litiges
   ===================================================================== */
function isSellerOf(o) { const u = me(); return !!(u && o && o.sellerId === u.uid); }
function isDriverOf(o) { const u = me(); return !!(u && o && o.driverId === u.uid); }
function isAdmin() { const u = me(); return !!(u && u.role === 'admin'); }
function returnFeeOf(o) { return o.returnFee != null ? o.returnFee : Math.round(o.fee * RETURN_RATE); }
function driverDelivered(uid) { return DB.orders.filter((o) => o.driverId === uid && o.status === 'delivered').length; }
function driverLimit(u) { return driverDelivered(u.uid) < NEW_DRIVER_RUNS ? NEW_DRIVER_LIMIT : DRIVER_LIMIT_MAX; }
function isLate(o) { return !!o.pickedAt && DRIVER_ACTIVE.includes(o.status) && o.status !== 'assigned' && Date.now() - Date.parse(o.pickedAt) > LATE_MS; }
function refundedFor(o) { return DB.refunds.filter((r) => r.orderId === o.id).reduce((s, r) => s + r.amount, 0); }

function formMode(f) { return networkOn() && f.mode === 'network' ? 'network' : 'own'; }
function itemFilled(f) { return !!(f.photo || String(f.name || '').trim() || String(f.price || '').trim()); }
function itemError(f) {
  const price = parseInt(f.price, 10), qty = parseInt(f.qty, 10);
  if (!f.photo) return 'Ajoutez une photo de l\'article.';
  if (!String(f.name || '').trim()) return 'Indiquez le nom de l\'article.';
  if (!Number.isFinite(price) || price < 100) return 'Le prix doit être d\'au moins 100 FCFA.';
  if (!Number.isFinite(qty) || qty < 1 || qty > 99) return 'La quantité doit être entre 1 et 99.';
  return '';
}
function takeItem(f) { return { photo: f.photo, name: f.name.trim(), desc: (f.desc || '').trim(), price: parseInt(f.price, 10), qty: parseInt(f.qty, 10) || 1 }; }
function formPrice(f) { return f.items.reduce((s, it) => s + it.price * it.qty, 0) + (parseInt(f.price, 10) || 0) * (parseInt(f.qty, 10) || 1); }
function formFee(f) { if (formMode(f) === 'network') { const n = networkFee(f); return n ? n.fee : 0; } const v = parseInt(f.fee, 10); return Number.isFinite(v) ? v : 0; }

function createOrder() {
  const u = me(); const f = UI.form; const mode = formMode(f);
  if (!isVerified(u)) return toast('Votre identité doit être vérifiée avant de créer un lien.', 'warn');
  if (sellerDebt(u) > DEBT_LIMIT) return toast(`Votre solde est négatif (−${fcfa(sellerDebt(u))}). Réglez-le avant de créer un nouveau lien.`, 'error');
  const items = f.items.slice();
  if (itemFilled(f) || !items.length) { const err = itemError(f); if (err) return toast(err, 'error'); items.push(takeItem(f)); }
  const price = items.reduce((s, it) => s + it.price * it.qty, 0);
  let fee;
  if (mode === 'network') {
    if (!sizeOf(f)) return toast('Choisissez la taille du colis.', 'error');
    if (!f.pickup.trim()) return toast('Indiquez où le livreur récupère le colis.', 'error');
    if (!f.location.trim()) return toast('Indiquez le quartier du client.', 'error');
    const nf = networkFee(f);
    if (!nf) return toast('Choisissez la commune de récupération et celle du client dans la liste : SûrPay en a besoin pour calculer la livraison.', 'error');
    fee = nf.fee;
  } else {
    fee = parseInt(f.fee, 10);
    if (!Number.isFinite(fee) || fee < 0) return toast('Indiquez le prix de la livraison (0 si elle est offerte).', 'error');
    if (fee > 20000) return toast('Livraison trop chère : 20 000 FCFA au maximum.', 'error');
    if (!f.location.trim()) return toast('Indiquez le quartier du client.', 'error');
  }
  if (!f.date || !f.time) return toast('Indiquez la date et l\'heure de livraison.', 'error');
  if (slotTs({ date: f.date, time: f.time }) < Date.now()) return toast('Le créneau de livraison est déjà passé.', 'error');
  const returnFee = mode === 'network' ? Math.round(fee * RETURN_RATE) : 0;
  const amounts = computeAmounts(price, fee);
  if (mode === 'own') { amounts.driverNet = 0; amounts.margin = 0; }
  const stored = items.map((it) => ({ ...it, photo: putImg(it.photo) }));

  let id = makeId(); while (getOrder(id)) id = makeId();
  const o = {
    id, mode, sellerId: u.uid, sellerName: u.name, shopName: (u.kyc && u.kyc.shopName) || '', driverId: null, driverName: null,
    items: stored, name: stored.length > 1 ? `${stored[0].name} + ${stored.length - 1} autre${stored.length > 2 ? 's' : ''}` : stored[0].name,
    desc: stored.length > 1 ? stored.map((it) => `${it.qty} × ${it.name}`).join(', ') : stored[0].desc,
    size: mode === 'network' ? f.size : null, price, fee, returnFee, ...amounts,
    pickup: mode === 'network' ? f.pickup.trim() : '', pickupHint: mode === 'network' ? (f.pickupHint || '').trim() : '', pickupGeo: mode === 'network' ? f.pickupGeo || null : null,
    location: f.location.trim(), date: f.date, time: f.time,
    photo: stored[0].photo, status: 'pending_payment', createdAt: nowISO(), history: [],
    client: null, waveRef: '', codeHash: null, codeAttempts: 0, codeLocked: false,
    driverPaid: 0, calls: [], arrival: null, absentDeadline: null, absentContest: null,
    pickupPhoto: null, refusal: null, dispute: null, returnReason: null, returned: false, reports: []
  };
  addHistory(o, mode === 'network' ? `Lien créé, livreur SûrPay (colis ${sizeOf(o).label.toLowerCase()}, livraison calculée : ${fcfa(fee)})` : `Lien créé, livraison par le vendeur (${fee ? fcfa(fee) : 'offerte'})`);
  DB.orders.unshift(o);
  if (!save()) { DB.orders.shift(); return; }
  UI.form = blankForm();
  UI.tab = 'orders'; UI.filter = 'all';
  render();
  openLinkSheet(o);
}

function waMessage(o) {
  const its = itemsOf(o);
  return `Bonjour 👋\n\nVoici votre commande sécurisée *SûrPay CI* :\n\n` +
    (its.length > 1 ? its.map((it) => `📦 ${it.qty} × ${it.name} : ${fcfa(it.price * it.qty)}`).join('\n') + '\n' : `📦 ${o.name}${o.desc ? ' (' + o.desc + ')' : ''}\n`) +

function lockEscrow(o, how) {
  const code = genSecretCode();
  VAULT[o.id] = code;
  o.codeHash = hashCode(code, o.id);
  o.codeAttempts = 0; o.codeLocked = false;
  o.status = 'escrow_locked'; o.paidAt = nowISO();
  ledger('security_fee', o.secFee, o.id, `Frais de sécurité 2 % : ${o.name}`);
  addHistory(o, how === 'admin' ? 'Paiement Wave vérifié par SûrPay, fonds bloqués' : how === 'api' ? 'Paiement confirmé par Wave, fonds bloqués' : 'Paiement enregistré sans vérification (mode démo), fonds bloqués');
  if (deliveryMode(o) === 'own') {
    addHistory(o, 'Le client confirmera lui-même la réception sur son lien');
    notify(o.sellerId, 'Paiement reçu', `${o.name} : ${fcfa(o.total)} bloqués chez SûrPay. Livrez avec votre livreur, puis touchez « Colis livré ».`, 'lock', o.id);
    if (o.client) waSend(o.client.wa, `✅ SûrPay : paiement reçu pour ${o.name} (${fcfa(o.total)}). Votre argent reste bloqué jusqu'à ce que vous confirmiez la réception.\nSuivi : ${orderLink(o.id)}`, { orderId: o.id, show: true });
    return;
  }
  addHistory(o, `Code secret envoyé au client sur WhatsApp (${maskPhone(o.client && o.client.wa)})`);
  if (o.client) waSend(o.client.wa, codeMessage(o), { orderId: o.id, show: true });
  notify(o.sellerId, 'Paiement reçu', `${o.name} : ${fcfa(o.total)} bloqués chez SûrPay. Préparez le colis.`, 'lock', o.id);
  Object.values(DB.users).forEach((x) => { if (x.role === 'driver' && x.uid !== o.sellerId && isVerified(x) && canCarry(x, o)) notify(x.uid, 'Nouvelle course', `${o.pickup} vers ${o.location}, prime de ${fcfa(o.driverNet)}`, 'bike', o.id); });
}
function codeMessage(o) {
  return `🔐 SûrPay : paiement reçu pour ${o.name} (${fcfa(o.total)}).\n\nVOTRE CODE SECRET : ${VAULT[o.id]}\n\nDonnez-le au livreur seulement après avoir ouvert et vérifié votre colis.\nSuivi : ${orderLink(o.id)}`;
}
/* « Mon livreur » : le vendeur livre, le client confirme */
function releaseOwn(o, by) {
  o.status = 'delivered'; o.deliveredAt = nowISO(); o.autoReleaseAt = null;
  const amt = o.price + o.fee;
  move(o.sellerId, 'gains', amt, `Vente encaissée : ${o.name}${o.fee ? ' (article et livraison)' : ''}`, o.id);
  addHistory(o, by === 'client' ? `Réception confirmée par le client. ${fcfa(amt)} versés au vendeur` : by === 'admin' ? `SûrPay libère le paiement : ${fcfa(amt)} versés au vendeur` : `Sans réponse du client 24 h après la livraison : ${fcfa(amt)} versés au vendeur`);
  notify(o.sellerId, 'Vente encaissée', `+${fcfa(amt)} pour ${o.name}.`, 'badgeCheck', o.id);
  if (o.client) waSend(o.client.wa, `SûrPay : commande ${o.id} terminée, merci ! Donnez votre avis sur le vendeur : ${orderLink(o.id)}`, { orderId: o.id });
}
function expireNotSent(o) {
  createRefund(o, o.total, 'Commande non expédiée : remboursement intégral');
  ledger('security_fee', -o.secFee, o.id, `Frais de sécurité remboursés : ${o.name}`);
  o.status = 'expired_not_sent'; o.closedAt = nowISO();
  addHistory(o, `Non expédiée 48 h après le créneau : commande annulée, client remboursé de ${fcfa(o.total)}`);
  notify(o.sellerId, 'Commande annulée', `${o.name} : non expédiée à temps, le client est remboursé.`, 'hourglass', o.id);
}
function ownCancel(o, reason) {
  if (reason === 'absent') {
    createRefund(o, o.price, 'Client injoignable : article remboursé, livraison gardée par le vendeur');
    if (o.fee) move(o.sellerId, 'gains', o.fee, `Livraison gardée (client injoignable) : ${o.name}`, o.id);
    o.status = 'cancelled_absent';
    addHistory(o, `Le vendeur déclare le client injoignable : ${fcfa(o.price)} remboursés au client, la livraison reste au vendeur. Le client peut contester auprès de SûrPay`);
    if (o.client) waSend(o.client.wa, `SûrPay : le vendeur n'a pas pu vous livrer ${o.name} (client injoignable). ${fcfa(o.price)} vous sont remboursés. Pas d'accord ? Répondez à ce message.`, { orderId: o.id });
  } else {
    createRefund(o, o.total, 'Annulée par le vendeur : remboursement intégral');
    ledger('security_fee', -o.secFee, o.id, `Frais de sécurité remboursés : ${o.name}`);
    o.status = 'cancelled_seller';
    addHistory(o, `Commande annulée par le vendeur après paiement : client remboursé de ${fcfa(o.total)}`);
    if (o.client) waSend(o.client.wa, `SûrPay : le vendeur a annulé ${o.name}. ${fcfa(o.total)} vous sont remboursés sur votre Wave.`, { orderId: o.id });
  }
  o.closedAt = nowISO();
}
function resolveProblem(o, how) {
  if (how === 'seller') { releaseOwn(o, 'admin'); return; }
  if (how === 'item') {
    createRefund(o, o.price, 'Problème : article remboursé, livraison payée au vendeur');
    if (o.fee) move(o.sellerId, 'gains', o.fee, `Livraison payée (litige) : ${o.name}`, o.id);
    addHistory(o, `SûrPay donne raison au client : ${fcfa(o.price)} remboursés, la livraison reste au vendeur. L'article revient au vendeur`);
  } else {
    createRefund(o, o.price + o.fee, 'Problème : article et livraison remboursés');
    addHistory(o, `SûrPay donne raison au client : ${fcfa(o.price + o.fee)} remboursés (article et livraison). L'article revient au vendeur`);
  }
  o.status = 'returned_non_compliant'; o.closedAt = nowISO();
  notify(o.sellerId, 'Litige tranché', `${o.name} : le client est remboursé. Récupérez votre article.`, 'scale', o.id);
}

function releaseDriver(o) {
  const d = userById(o.driverId);
  if (d && d.activeOrderId === o.id) d.activeOrderId = null;
  delete UI.keypad[o.id]; delete UI.keypad['r:' + o.id]; delete UI.driverMode[o.id];
}
function payDriver(o, amount, label) { if (amount > 0 && o.driverId) move(o.driverId, 'wallet', amount, label, o.id); }
function finishDriverPay(o) {
  const rest = o.driverNet - (o.driverPaid || 0);
  if (rest > 0) { payDriver(o, rest, `Solde de la prime : ${o.name}`); o.driverPaid = o.driverNet; }
}
function createRefund(o, amount, reason) {
  amount = Math.max(0, Math.round(amount)); if (!amount) return;
  DB.refunds.unshift({ id: 'RB' + Date.now().toString(36).toUpperCase() + Math.floor(Math.random() * 99), orderId: o.id, amount, to: o.client ? o.client.wa : null, reason, status: 'pending', createdAt: nowISO() });
  notifyRole('admin', 'Remboursement à faire', `${fcfa(amount)} à envoyer au client (${o.id}).`, 'banknote', o.id);
}

function verifyCode(o) {
  const v = UI.keypad[o.id] || '';
  if (v.length !== 4) return toast('Le code contient 4 chiffres.', 'warn');
  if (o.codeLocked) return toast('Saisie bloquée : le litige est entre les mains de SûrPay.', 'error');
  if (hashCode(v, o.id) === o.codeHash) {
    o.status = 'delivered'; o.deliveredAt = nowISO(); o.refusal = null; o.absentContest = null; o.absentDeadline = null;
    move(o.sellerId, 'gains', o.price, `Vente encaissée : ${o.name}`, o.id);
    finishDriverPay(o);
    addHistory(o, `Code validé, livraison confirmée. ${fcfa(o.price)} versés au vendeur`);
    notify(o.sellerId, 'Vente encaissée', `+${fcfa(o.price)} pour ${o.name}. Retirable sur Wave.`, 'badgeCheck', o.id);
    releaseDriver(o);
    save(); UI.tab = 'courses'; render();
    openSheet(`
      <div class="py-4 text-center">
        <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-emerald-500 text-white">${ic('badgeCheck', 'h-8 w-8')}</div>
        <h2 class="mt-4 text-xl font-extrabold">Livraison validée</h2>
        <p class="mt-1 text-sm text-mute">Le vendeur reçoit ${fcfa(o.price)}. Votre prime complète de ${fcfa(o.driverNet)} est dans votre portefeuille.</p>
        <button class="btn btn-primary btn-lg mt-6 w-full" data-action="close-sheet">Voir les autres courses</button>
      </div>`);
  } else {
    o.codeAttempts += 1; UI.keypad[o.id] = '';
    const left = MAX_CODE_ATTEMPTS - o.codeAttempts;
    if (left <= 0) {
      o.codeLocked = true;
      notifyRole('admin', 'Litige : code bloqué', `${o.name} (${o.id}) : 3 codes incorrects saisis.`, 'scale', o.id);
      addHistory(o, '3 codes incorrects : saisie bloquée, litige ouvert');
      toast('3 codes incorrects. La saisie est bloquée et SûrPay est alerté.', 'error');
    } else {
      addHistory(o, `Code incorrect saisi (${left} essai${left > 1 ? 's' : ''} restant${left > 1 ? 's' : ''})`);
      toast(`Code incorrect. Encore ${left} essai${left > 1 ? 's' : ''}.`, 'error');
    }
    save(); render();
  }
}

function startReturn(o, reason) {
  const rc = genSecretCode();
  VAULT['ret:' + o.id] = rc;
  o.returnHash = hashCode(rc, 'ret:' + o.id); o.returnAttempts = 0; o.returnLocked = false;
  o.returnReason = reason; o.returnStartedAt = nowISO(); o.status = 'return_to_seller'; o.absentDeadline = null;
  notify(o.sellerId, 'Colis en retour', `${o.name} revient chez vous. À la remise, donnez au livreur le code de retour affiché dans la commande.`, 'undo', o.id);
}

function verifyReturn(o) {
  const key = 'r:' + o.id; const v = UI.keypad[key] || '';
  if (v.length !== 4) return toast('Le code de retour contient 4 chiffres.', 'warn');
  if (o.returnLocked) return toast('Saisie bloquée : contactez SûrPay.', 'error');
  if (hashCode(v, 'ret:' + o.id) === o.returnHash) { completeReturn(o); save(); UI.tab = 'courses'; render(); toast('Retour validé. Primes versées.', 'success'); return; }
  o.returnAttempts = (o.returnAttempts || 0) + 1; UI.keypad[key] = '';
  if (o.returnAttempts >= 5) { o.returnLocked = true; notifyRole('admin', 'Retour bloqué', `${o.name} (${o.id}) : 5 codes de retour incorrects.`, 'scale', o.id); addHistory(o, '5 codes de retour incorrects : saisie bloquée'); }
  toast('Code de retour incorrect.', 'error'); save(); render();
}

function completeReturn(o) {
  o.returned = true; o.returnedAt = nowISO();
  finishDriverPay(o);
  const rf = o.returnReason === 'absent' ? returnFeeOf(o) : 0;
  if (rf) payDriver(o, rf, `Prime de retour : ${o.name}`);
  addHistory(o, rf ? `Colis rendu au vendeur (code de retour validé). Prime de retour de ${fcfa(rf)} versée au livreur` : 'Colis rendu au vendeur (code de retour validé). Prime versée au livreur');
  notify(o.sellerId, 'Colis rendu', `${o.name} vous a été rendu.`, 'packageCheck', o.id);
  releaseDriver(o);
  settle(o);
}

function settle(o) {
  if (!o.returned) return;
  if (o.returnReason === 'absent') { o.status = 'cancelled_absent'; o.closedAt = nowISO(); return; }
  const d = o.dispute;
  if (d && d.status === 'client_right') { o.status = 'returned_non_compliant'; o.closedAt = nowISO(); }
  else if (d && d.status === 'seller_right') { o.status = 'refused_abusive'; o.closedAt = nowISO(); }
  else o.status = 'dispute_open';
}

function finalizeAbsent(o, by) {
  const refund = Math.max(0, o.price - returnFeeOf(o));
  createRefund(o, refund, 'Client absent : article remboursé, retour du colis déduit');
  addHistory(o, `${by === 'admin' ? 'SûrPay confirme l\'absence du client' : 'Chrono écoulé'} : commande annulée. ${fcfa(refund)} remboursés au client (article moins le retour). Le livreur ramène le colis au vendeur`);
  notify(o.driverId, 'Absence confirmée', `Ramenez ${o.name} au vendeur pour toucher le solde de votre prime et la prime de retour.`, 'undo', o.id);
  o.absentContest = null;
  startReturn(o, 'absent');
}

function confirmRefusal(o, by) {
  /* Article non conforme : le client est remboursé tout de suite (article + livraison) et les frais de livraison
     sont pris sur le solde du vendeur. Pas de contestation. Le livreur rapporte quand même le colis au vendeur. */
  o.dispute = { status: 'client_right', openedAt: nowISO(), resolvedAt: nowISO(), by: 'auto', note: o.refusal.note, photo: o.refusal.photo };
  createRefund(o, o.price + o.fee, 'Article non conforme : article et livraison remboursés');
  move(o.sellerId, 'gains', -o.fee, `Article non conforme : ${o.name} (frais de livraison)`, o.id);
  addHistory(o, `Refus confirmé par ${by === 'admin' ? 'SûrPay (au téléphone avec le client)' : 'le client'} : ${o.refusal.note}. Client remboursé de ${fcfa(o.price + o.fee)} (article et livraison), ${fcfa(o.fee)} pris sur la caution du vendeur. Le livreur rapporte le colis au vendeur`);
  notify(o.sellerId, 'Article non conforme', `${o.name} : ${o.refusal.note}. ${fcfa(o.fee)} pris sur votre solde. Le colis vous revient : donnez votre code de retour au livreur.`, 'scale', o.id);
  notify(o.driverId, 'Refus confirmé', `Ramenez ${o.name} au vendeur pour recevoir votre prime.`, 'undo', o.id);
  startReturn(o, 'refused');
}

function resolveDispute(o, winner, by) {
  const d = o.dispute; if (!d || ['client_right', 'seller_right'].includes(d.status)) return;
  d.status = winner; d.resolvedAt = nowISO(); d.by = by;
  const who = by === 'seller' ? 'Le vendeur accepte le retour' : by === 'auto' ? 'Sans réponse du vendeur sous 24 h' : 'Décision SûrPay';
  if (winner === 'client_right') {
    createRefund(o, o.price + o.fee, 'Refus justifié : article et livraison remboursés');
    move(o.sellerId, 'gains', -o.fee, `Retour justifié : ${o.name} (frais de livraison)`, o.id);
    addHistory(o, `${who} : refus justifié. Client remboursé de ${fcfa(o.price + o.fee)}, ${fcfa(o.fee)} pris sur le solde du vendeur`);
    notify(o.sellerId, 'Litige clos', `${o.name} : refus justifié. ${fcfa(o.fee)} pris sur votre solde.`, 'scale', o.id);
  } else {
    const r = Math.max(0, o.price - returnFeeOf(o));
    createRefund(o, r, 'Refus non justifié : article remboursé, livraison et retour à la charge du client');
    addHistory(o, `${who} : refus non justifié. Client remboursé de ${fcfa(r)} (livraison et retour à sa charge). Rien n'est retiré au vendeur`);
    notify(o.sellerId, 'Litige gagné', `${o.name} : SûrPay vous donne raison, rien ne vous est retiré.`, 'scale', o.id);
  }
  settle(o);
}

function declareLost(o) {
  const due = Math.max(0, o.price + o.fee - refundedFor(o));
  createRefund(o, due, 'Colis perdu : remboursement intégral');
  move(o.sellerId, 'gains', o.price, `Indemnisation colis perdu : ${o.name}`, o.id);
  const d = userById(o.driverId);
  if (d) {
    const seize = 0;
    const fromWallet = Math.min(Math.max(0, d.wallet || 0), o.price - seize);
    if (fromWallet) move(d.uid, 'wallet', -fromWallet, `Solde saisi : colis perdu (${o.name})`, o.id);
    d.kyc = d.kyc || {}; d.kyc.status = 'suspended'; d.kyc.reason = 'Colis perdu ' + o.id;
    notify(d.uid, 'Compte suspendu', `Colis ${o.name} déclaré perdu. Votre solde est saisi et SûrPay vous contacte.`, 'shieldAlert', o.id);
  }
  releaseDriver(o);
  o.status = 'lost'; o.closedAt = nowISO();
  addHistory(o, `Colis déclaré perdu par SûrPay : client remboursé, vendeur indemnisé de ${fcfa(o.price)}, livreur suspendu`);
  notify(o.sellerId, 'Colis perdu : indemnisation', `+${fcfa(o.price)} pour ${o.name}.`, 'shieldAlert', o.id);
}

function clientCancel(o) {
  if (!['escrow_locked', 'assigned'].includes(o.status)) return;
  if (o.driverId) notify(o.driverId, 'Course annulée', `${o.name} : le client a annulé avant la récupération.`, 'circleX', o.id);
  releaseDriver(o);
  createRefund(o, o.price + o.fee, 'Annulation par le client avant la récupération (frais de sécurité conservés)');
  o.status = 'cancelled_client'; o.closedAt = nowISO();
  addHistory(o, `Commande annulée par le client avant la récupération. ${fcfa(o.price + o.fee)} remboursés`);
  notify(o.sellerId, 'Commande annulée par le client', `${o.name} : annulée avant la récupération du colis.`, 'circleX', o.id);
}

function expireNoDriver(o) {
  createRefund(o, o.total, 'Aucun livreur disponible : remboursement intégral');
  ledger('security_fee', -o.secFee, o.id, `Frais de sécurité remboursés : ${o.name}`);
  o.status = 'expired_no_driver'; o.closedAt = nowISO();
  addHistory(o, `Aucun livreur 2 h après le créneau : commande annulée, client remboursé de ${fcfa(o.total)}`);
  notify(o.sellerId, 'Commande annulée', `${o.name} : aucun livreur disponible, le client est remboursé.`, 'hourglass', o.id);
}

/* Délais automatiques (exécutés chaque seconde et au démarrage) */
function runTimers() {
  const now = Date.now(); let changed = false;
  DB.orders.forEach((o) => {
    if (o.status === 'pending_payment' && now - Date.parse(o.createdAt) > LINK_TTL_MS) {
      o.status = 'expired'; addHistory(o, 'Lien expiré au bout de 48 h sans paiement');
      notify(o.sellerId, 'Lien expiré', `${o.name} : aucun paiement en 48 h.`, 'hourglass', o.id); changed = true;
    } else if (o.status === 'escrow_locked' && deliveryMode(o) === 'network' && now > slotTs(o) + NO_DRIVER_GRACE_MS) {
      expireNoDriver(o); changed = true;
    } else if (o.status === 'escrow_locked' && deliveryMode(o) === 'own' && now > slotTs(o) + NOT_SENT_MS) {
      expireNotSent(o); changed = true;
    } else if (o.status === 'awaiting_confirm' && o.autoReleaseAt && now >= o.autoReleaseAt) {
      releaseOwn(o, 'auto'); changed = true;
    } else if (o.status === 'absent_countdown' && o.absentDeadline && !o.absentContest && now >= o.absentDeadline) {
      finalizeAbsent(o, 'timer'); changed = true;
    }
    if (o.dispute && o.dispute.status === 'open' && now >= o.dispute.deadline) { resolveDispute(o, 'client_right', 'auto'); changed = true; }
  });
  return changed;
}

function callsSinceArrival(o) { const t = o.arrival ? Date.parse(o.arrival.at) : 0; return (o.calls || []).filter((c) => Date.parse(c) >= t).length; }

/* Paiement Wave automatique : votre serveur crée la session Wave Checkout avec la clé API
   (montant figé par Wave, payeur limité au numéro du client) et confirme le paiement par webhook. */
async function startWaveCheckout(o) {
  try {
    toast('Ouverture de Wave…', 'info');
    const r = await fetch(WAVE_CHECKOUT_ENDPOINT, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ order_id: o.id, amount: String(o.total), currency: 'XOF', restrict_payer_mobile: '+225' + o.client.wa, success_url: orderLink(o.id) + '/wave', error_url: orderLink(o.id) })
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const s = await r.json();
    o.waveSession = s.id; setGrant(o.id); save();
    location.href = s.wave_launch_url; // à ouvrir dans le navigateur, jamais dans une webview
  } catch (e) { toast('Impossible de démarrer le paiement Wave. Réessayez dans un instant.', 'error'); }
}
async function checkWaveReturn(o) {
  if (!WAVE_CHECKOUT_ENDPOINT || !o.waveSession || o.status !== 'pending_payment') return;
  try {
    const r = await fetch(WAVE_CHECKOUT_ENDPOINT + '/' + encodeURIComponent(o.waveSession));
    const s = await r.json();
    if (s.payment_status === 'succeeded') { lockEscrow(o, 'api'); save(); render(); toast('Paiement confirmé par Wave.', 'success'); }
    else toast('Wave n\'a pas encore confirmé le paiement.', 'warn');
  } catch (e) { toast('Vérification impossible pour le moment.', 'error'); }
}

    else if (k === 'ok') { UI.keypad[key] = v; return mode === 'return' ? verifyReturn(o) : verifyCode(o); }

    UI.keypad[key] = v; render();

function kycValidate(step) {
  const u = me(); const k = u.kyc;
  if (step === 1) {
    k.fullName = String(k.fullName || '').trim();
    if (k.fullName.length < 3) { toast('Indiquez votre nom complet tel qu\'il figure sur votre document.', 'error'); return false; }
    const ph = normalizePhone(k.phone);
    if (!ph) { toast('Numéro WhatsApp invalide : 10 chiffres, par exemple 07 07 12 34 56.', 'error'); return false; }
    const wv = String(k.wave || '').trim() ? normalizePhone(k.wave) : ph;
    if (!wv) { toast('Numéro Wave invalide.', 'error'); return false; }
    k.phone = ph; k.wave = wv;
    if (u.role === 'seller') {
      k.shopName = String(k.shopName || '').trim();
      if (k.shopName.length < 2) { toast('Indiquez le nom de votre boutique.', 'error'); return false; }
    } else {
      vehMigrate(k);
      const vm = vehMissing(k); if (vm) { toast(vm, 'error'); return false; }
      vehApply(k, k);
    }
    const dup = Object.values(DB.users).find((x) => x.uid !== u.uid && x.kyc && ['pending', 'approved'].includes(x.kyc.status) && x.kyc.phone === ph);
    if (dup) { toast('Ce numéro WhatsApp est déjà utilisé par un autre compte vérifié.', 'error'); return false; }
    return true;
  }
  if (step === 2) {
    const d = docInfo(k.docType);
    if (!d) { toast('Choisissez votre type de document.', 'error'); return false; }
    k.docNumber = String(k.docNumber || '').trim().toUpperCase();
    if (normDoc(k.docNumber).length < 6) { toast('Numéro du document trop court. Recopiez-le exactement.', 'error'); return false; }
    if (!k.birthDate) { toast('Indiquez votre date de naissance.', 'error'); return false; }
    if (ageFrom(k.birthDate) < 18) { toast('Il faut avoir au moins 18 ans pour vendre ou livrer avec SûrPay.', 'error'); return false; }
    if (d.expires) {
      if (!k.expiry) { toast('Indiquez la date d\'expiration du document.', 'error'); return false; }
      if (k.expiry < todayISO()) { toast('Ce document est expiré. Utilisez un document en cours de validité.', 'error'); return false; }
    }
    if (!k.recto) { toast(d.verso ? 'Prenez le recto en photo.' : 'Prenez la page principale en photo.', 'error'); return false; }
    if (d.verso && !k.verso) { toast('Prenez le verso en photo.', 'error'); return false; }
    if (!d.verso) k.verso = null;
    const dup = Object.values(DB.users).find((x) => x.uid !== u.uid && x.kyc && ['pending', 'approved'].includes(x.kyc.status) && normDoc(x.kyc.docNumber) === normDoc(k.docNumber));
    if (dup) { toast('Ce document est déjà associé à un autre compte.', 'error'); return false; }
    return true;
  }
  if (step === 3) {
    if (!k.selfie) { toast('Prenez votre selfie.', 'error'); return false; }
    return true;
  }
  return true;
}

async function phoneSend() {
  const phone = normalizePhone(($('#ph-num') || {}).value);
  if (!phone) return toast('Numéro invalide : 10 chiffres, par exemple 07 07 12 34 56.', 'error');
  if (FB && !DEMO_MODE) {
    try {
      if (!FB.recaptcha) FB.recaptcha = new FB.m.RecaptchaVerifier(FB.auth, 'ph-recaptcha', { size: 'invisible' });
      FB.confirm = await FB.m.signInWithPhoneNumber(FB.auth, '+225' + phone, FB.recaptcha);
      UI.phone = { step: 2, phone }; openPhoneSheet();
    } catch (e) {
      const c = (e && e.code) || '';
      toast(c === 'auth/operation-not-allowed' ? 'Activez la connexion par téléphone dans Firebase Authentication.' : c === 'auth/too-many-requests' ? 'Trop d\'essais. Réessayez plus tard.' : 'Envoi du code impossible (' + (c || 'erreur') + ').', 'error');
    }
    return;
  }
  const code = String(Math.floor(100000 + Math.random() * 900000));
  UI.phone = { step: 2, phone, code, exp: Date.now() + OTP_TTL_MS };
  openPhoneSheet();
  waBubble(phone, `Votre code de connexion SûrPay : ${code}`);
}
async function phoneVerify() {
  const p = UI.phone || {}; const code = String(($('#ph-code') || {}).value || '').replace(/\D/g, '');
  if (code.length !== 6) return toast('Le code contient 6 chiffres.', 'error');
  if (FB && !DEMO_MODE && FB.confirm) {
    try { const res = await FB.confirm.confirm(code); onFirebaseUser(res.user, true); } catch (e) { toast('Code incorrect ou expiré.', 'error'); }
    return;
  }
  if (!p.code || Date.now() > p.exp) return toast('Code expiré. Demandez-en un nouveau.', 'error');
  if (code !== p.code) return toast('Code incorrect.', 'error');
  const u = ensureUser({ uid: 'tel-' + p.phone, name: prettyPhone(p.phone), email: '', provider: 'phone' });
  u.phone = p.phone; if (u.kyc && !u.kyc.phone) u.kyc.phone = p.phone;
  const r = $('#wa-root'); if (r) r.innerHTML = '';
  UI.phone = null; signInAs(u.uid, true);
}

function sellerAlerts(u) {
  const mine = DB.orders.filter((o) => o.sellerId === u.uid);
  const items = [
    ...mine.filter((o) => o.dispute && o.dispute.status === 'open').map((o) => ['scale', 'bg-rose-50 text-rose-800', `${o.name} : le client a refusé l'article. Répondez avant le ${fmtTime(new Date(o.dispute.deadline).toISOString())}.`, o.id]),
    ...mine.filter((o) => o.status === 'return_to_seller').map((o) => ['undo', 'bg-orange-50 text-orange-900', `${o.name} revient chez vous. Votre code de retour est dans la commande.`, o.id]),
    ...mine.filter((o) => deliveryMode(o) === 'own' && o.status === 'escrow_locked').map((o) => ['lock', 'bg-emerald-50 text-emerald-900', `${o.name} est payé : livrez-le, puis touchez « Colis livré ».`, o.id]),
    ...mine.filter((o) => o.status === 'problem').map((o) => ['scale', 'bg-rose-50 text-rose-800', `${o.name} : le client signale un problème. SûrPay examine.`, o.id])
  ];
  return items.map(([i, c, t, id]) => `<button class="flex w-full items-center gap-3 rounded-2xl ${c} p-3.5 text-left text-sm font-semibold" data-action="order-detail" data-id="${id}">${ic(i, 'h-5 w-5')}<span class="flex-1">${esc(t)}</span>${ic('chevronRight', 'h-4 w-4')}</button>`).join('');
}

function calcHTML() {
  const f = UI.form; const mode = formMode(f);
  const price = formPrice(f); const fee = formFee(f);
  const nf = mode === 'network' ? networkFee(f) : null;
  const feeLine = mode === 'network' ? (nf ? `
    <div class="flex gap-2.5 rounded-2xl bg-sky-50 p-3 text-[13px] text-sky-900">${ic('info', 'h-4 w-4 mt-0.5 shrink-0')}<span>Livraison calculée par SûrPay : ${esc(nf.from)} → ${esc(nf.to)}, environ ${nf.km} km${nf.extra ? `, plus ${fcfa(nf.extra)} pour un colis ${esc(sizeOf(f).label.toLowerCase())}` : ''} : <b>${fcfa(nf.fee)}</b>. Même prix à toute heure.</span></div>` : `
    <div class="flex gap-2.5 rounded-2xl bg-surface p-3 text-[13px] text-mute">${ic('info', 'h-4 w-4 mt-0.5 shrink-0')}<span>Choisissez la commune de récupération et celle du client dans la liste : SûrPay calcule la livraison.</span></div>`) : '';
  if (!price) return feeLine + `<div class="mt-3 flex gap-2.5 rounded-2xl bg-surface p-3.5 text-sm text-mute">${ic('info', 'h-4 w-4 mt-0.5')}<span>Le total s'affiche dès que vous entrez un prix.</span></div>`;
  const a = computeAmounts(price, fee); const n = f.items.length + (itemFilled(f) ? 1 : 0);
  return feeLine + `
    <div class="mt-3 rounded-2xl bg-surface p-4 text-sm">
      <div class="flex justify-between py-1"><span class="text-mute">${n > 1 ? n + ' articles' : 'Article'}</span><span class="font-semibold tabular-nums">${fcfa(price)}</span></div>
      <div class="flex justify-between py-1"><span class="text-mute">Livraison</span><span class="font-semibold tabular-nums">${fee ? fcfa(fee) : 'Offerte'}</span></div>
      <div class="flex justify-between py-1"><span class="text-mute">Frais de sécurité (2 %)</span><span class="font-semibold tabular-nums">${fcfa(a.secFee)}</span></div>
      <div class="mt-2 flex items-baseline justify-between border-t border-dashed border-slate-300 pt-3"><span class="font-bold">Le client paie</span><span class="amount text-xl text-emerald-700">${fcfa(a.total)}</span></div>
      <div class="mt-3 space-y-1 text-[13px] text-mute">
        ${mode === 'own'
          ? `<div>Vous recevez <b class="text-ink">${fcfa(price + fee)}</b>${fee ? ' (articles et livraison, pour payer votre livreur)' : ''} dès que le client confirme la réception.</div>`
          : `<div>Vous recevez <b class="text-ink">${fcfa(price)}</b> dès que le client donne son code au livreur.</div><div>Le livreur SûrPay touche ${fcfa(a.driverNet)}.</div>`}
      </div>
    </div>`;
}

          <span class="absolute bottom-3 right-3 flex items-center gap-1.5 rounded-full bg-night/80 px-3 py-1.5 text-xs font-bold text-white backdrop-blur">${ic('camera', 'h-3.5 w-3.5')} Reprendre</span>` : `
          <div class="weave-soft flex h-44 flex-col items-center justify-center bg-surface text-mute">
            <span class="flex h-14 w-14 items-center justify-center rounded-2xl bg-white text-emerald-600 shadow-sm">${ic('camera', 'h-7 w-7')}</span>
            <span class="mt-3 font-bold text-ink">Photographier l'article</span>
            <span class="text-xs">Le client verra cette photo</span>
          </div>`}
      </button>
      <label class="flex cursor-pointer items-center justify-center gap-1.5 border-b border-line py-2.5 text-[13px] font-semibold text-mute hover:bg-surface">${ic('images', 'h-4 w-4')} Ou importer une photo déjà prise<input type="file" accept="image/*" class="hidden" data-photo="form"></label>
      <div class="space-y-4 p-4">
        <div><label class="lbl" for="f-name">Nom de l'article</label><input id="f-name" class="field" data-model="name" value="${esc(f.name)}" placeholder="Ex : Robe en pagne wax" maxlength="60"></div>
        <div><label class="lbl" for="f-desc">Taille, couleur</label><input id="f-desc" class="field" data-model="desc" value="${esc(f.desc)}" placeholder="Ex : Taille M, bleu et orange" maxlength="100"></div>
        <div class="grid grid-cols-3 gap-3">
          <div><label class="lbl" for="f-qty">Quantité</label><input id="f-qty" class="field font-bold" data-model="qty" value="${esc(f.qty)}" type="number" inputmode="numeric" min="1" max="99"></div>
          <div class="col-span-2"><label class="lbl" for="f-price">Prix à l'unité (FCFA)</label><input id="f-price" class="field font-bold" data-model="price" value="${esc(f.price)}" type="number" inputmode="numeric" placeholder="15 000"></div>
        </div>
        <button type="button" class="btn btn-line w-full text-[13px]" data-action="item-add">${ic('plus', 'h-4 w-4')} Ajouter un autre article à la commande</button>
      </div>
    </section>
    <section class="card space-y-4 p-4">
      <h2 class="font-extrabold">Livraison</h2>

        ${[['own', 'Mon livreur', 'Vous fixez le prix'], ['network', 'Livreur SûrPay', 'Prix calculé']].map(([v, t, d]) => `<button type="button" class="rounded-2xl border-2 px-3 py-2.5 text-left transition ${mode === v ? 'border-emerald-500 bg-emerald-50 text-emerald-800' : 'border-line text-ink'}" data-action="mode-pick" data-v="${v}" aria-pressed="${mode === v}"><div class="text-sm font-extrabold">${t}</div><div class="text-[11px] text-mute">${d}</div></button>`).join('')}

      <div><label class="lbl" for="f-fee">Prix de la livraison (FCFA)</label><input id="f-fee" class="field font-bold" data-model="fee" value="${esc(f.fee)}" type="number" inputmode="numeric" placeholder="1 500, ou 0 si elle est offerte"></div>` : `
      <div>
        <div class="lbl">Taille du colis</div>
        <div class="grid grid-cols-3 gap-2" role="group" aria-label="Taille du colis">${PARCEL_SIZES.map((s) => `<button type="button" class="rounded-2xl border-2 px-2 py-2.5 text-center transition ${f.size === s.id ? 'border-emerald-500 bg-emerald-50 text-emerald-800' : 'border-line text-ink'}" data-action="size-pick" data-v="${s.id}" aria-pressed="${f.size === s.id}"><div class="text-sm font-extrabold">${s.label}</div><div class="text-[11px] text-mute">${s.short}</div></button>`).join('')}</div>
        <p class="mt-1.5 text-xs text-mute">${f.size ? esc(sizeOf(f).hint) : 'Seuls les livreurs qui ont l\'engin adapté verront la course.'}</p>
      </div>
      <div><label class="lbl" for="f-pickup">Récupération chez vous</label><input id="f-pickup" class="field" data-model="pickup" value="${esc(f.pickup)}" list="zones" placeholder="Ex : Marcory Zone 4"></div>

function escrowLine(o) {
  return ({
    pending_payment: 'Aucun paiement reçu', pending_wave_admin: 'Paiement en cours de vérification',
    escrow_locked: `${fcfa(o.total)} bloqués`, assigned: `${fcfa(o.total)} bloqués`,
    in_delivery: `${fcfa(o.price)} bloqués pour vous`, arrived: `${fcfa(o.price)} bloqués pour vous`, absent_countdown: `${fcfa(o.price)} bloqués pour vous`,
    refusal_pending: 'Le client hésite à refuser l\'article', return_to_seller: 'Colis en retour vers vous', dispute_open: 'Litige en cours d\'examen',
    delivered: `${fcfa(o.price)} versés sur votre solde`, cancelled_absent: 'Client absent, colis rendu',
    returned_non_compliant: deliveryMode(o) === 'own' ? 'Litige : client remboursé' : `Non conforme : ${fcfa(o.fee)} pris sur votre solde`, refused_abusive: 'Refus non justifié : rien ne vous est retiré',

    shipping: `${fcfa(o.price + o.fee)} bloqués pour vous`, awaiting_confirm: `${fcfa(o.price + o.fee)} versés à la confirmation du client`,
    problem: 'Paiement bloqué : SûrPay examine le problème', expired_not_sent: 'Non expédiée, client remboursé'
  })[o.status] || '';
}

function timeline(o) {

  return `<ol class="relative ml-1.5 space-y-3.5 border-l-2 border-line pl-5">${items.map((h, i) => `
    <li class="relative"><span class="absolute -left-[27px] top-1 h-3 w-3 rounded-full ${i === 0 ? 'bg-emerald-500 ring-4 ring-emerald-100' : 'bg-slate-300'}"></span>

            ${o.desc ? `<span class="block truncate text-xs text-mute">${esc(o.desc)}</span>` : ''}
            <span class="amount mt-1 block text-[15px] text-emerald-700">${fcfa(o.total)}</span>

      </button>`).join('')}</div>` : `
      <div class="py-10 text-center"><span class="mx-auto flex h-12 w-12 items-center justify-center rounded-2xl bg-surface text-mute">${ic('bell', 'h-6 w-6')}</span><div class="mt-3 font-bold">Rien de nouveau</div><p class="mt-1 text-sm text-mute">Paiements, courses et validations s'afficheront ici.</p></div>`}`);

function routeBlock(o, back) {
  const a = { label: 'Récupération', place: o.pickup, hint: o.pickupHint, geo: o.pickupGeo, dot: 'bg-night' };
  const b = { label: 'Livraison', place: o.location, hint: o.client && o.client.hint, geo: o.client && o.client.geo, dot: 'bg-emerald-500' };
  const pts = back ? [{ ...b, label: 'Départ' }, { ...a, label: 'Retour chez le vendeur' }] : [a, b];
  return `
    <div class="relative pl-7 text-sm">
      <span class="absolute bottom-3 left-[7px] top-3 w-0.5 bg-line"></span>
      ${pts.map((p, i) => `
      <div class="relative ${i ? 'mt-3' : ''}">
        <span class="absolute -left-7 top-0.5 flex h-4 w-4 items-center justify-center rounded-full ${p.dot} ring-4 ring-white"></span>
        <div class="flex items-start justify-between gap-2">
          <div class="min-w-0"><div class="text-xs text-mute">${p.label}</div><div class="font-bold">${esc(p.place)}</div>${p.hint ? `<div class="text-xs text-mute">Repère : ${esc(p.hint)}</div>` : ''}${p.geo ? `<div class="mt-0.5 flex items-center gap-1 text-[11.5px] font-semibold text-emerald-700">${ic('mapPin', 'h-3 w-3')}Position GPS précise</div>` : ''}</div>
          <a href="${mapsLink(p.geo, p.place)}" target="_blank" rel="noopener" class="flex shrink-0 items-center gap-1 rounded-full bg-surface px-2.5 py-1.5 text-xs font-bold text-ink">${ic('navigation', 'h-3.5 w-3.5')}Itinéraire</a>
        </div>
      </div>`).join('')}
    </div>`;
}

          <span class="amount absolute bottom-3 right-3 rounded-xl bg-emerald-500 px-3 py-1.5 text-white shadow-lg">+${fcfa(o.driverNet)}</span>
          <span class="absolute left-3 top-3">${badge(o.status)}</span>
        </div>
        <div class="space-y-4 p-4">

          ${sizeChip(o)}
          ${routeBlock(o)}
          <div class="flex items-center gap-2 text-sm text-mute">${ic('calendarClock', 'h-4 w-4')}${esc(fmtSlot(o))}</div>
          <button class="btn btn-primary w-full" data-action="accept" data-id="${o.id}" ${u.activeOrderId || !isVerified(u) || over ? 'disabled' : ''}>${ic('check', 'h-4 w-4')} ${kycStatus(u) === 'suspended' ? 'Compte suspendu' : !isVerified(u) ? 'Disponible après vérification' : over ? 'Au-dessus de votre plafond' : 'Accepter la course'}</button>

}

function keypadHTML(o, mode) {
  const key = mode === 'return' ? 'r:' + o.id : o.id;
  const locked = mode === 'return' ? o.returnLocked : o.codeLocked;
  if (locked) return `<div class="flex gap-2 rounded-2xl bg-rose-50 p-4 text-sm font-semibold text-rose-700">${ic('lock', 'h-4 w-4 mt-0.5')} Saisie bloquée après trop de codes incorrects. SûrPay traite le litige.</div>`;
  const kp = UI.keypad[key] || '';
  const tries = mode === 'return' ? 5 - (o.returnAttempts || 0) : MAX_CODE_ATTEMPTS - o.codeAttempts;
  return `
    <div class="rounded-2xl bg-white p-1">
      <div class="flex justify-center gap-2.5">${[0, 1, 2, 3].map((i) => `<div class="flex h-16 w-14 items-center justify-center rounded-2xl text-3xl font-extrabold tabular-nums ${kp[i] ? 'bg-night text-white' : 'bg-surface ring-2 ring-line'}">${kp[i] || ''}</div>`).join('')}</div>
      <div class="mt-2 text-center text-xs text-mute">${tries} essai${tries > 1 ? 's' : ''} restant${tries > 1 ? 's' : ''}</div>
      <div class="mt-3 grid grid-cols-3 gap-2">${['1', '2', '3', '4', '5', '6', '7', '8', '9', 'del', '0', 'ok'].map((k) => `<button class="key ${k === 'ok' ? '!bg-emerald-500 !text-white' : ''}" data-action="kp" data-mode="${mode}" data-id="${o.id}" data-k="${k}" aria-label="${k === 'del' ? 'Effacer' : k === 'ok' ? 'Valider le code' : k}">${k === 'del' ? ic('del', 'h-6 w-6') : k === 'ok' ? ic('check', 'h-7 w-7') : k}</button>`).join('')}</div>
    </div>`;
}

function driverActive(u) {
  const o = u.activeOrderId ? getOrder(u.activeOrderId) : null;
  if (!o || !DRIVER_ACTIVE.includes(o.status)) {
    if (u.activeOrderId) { u.activeOrderId = null; save(); }
    return `
      <div class="h-title">Ma course</div>
      <div class="card p-8 text-center">
        <span class="mx-auto flex h-12 w-12 items-center justify-center rounded-2xl bg-surface text-mute">${ic('navigation', 'h-6 w-6')}</span>
        <div class="mt-3 font-bold">Aucune course en cours</div>
        <button class="btn btn-primary mt-4" data-action="tab" data-tab="courses">Voir les courses</button>
      </div>`;
  }
  const back = o.status === 'return_to_seller';
  const step = back ? 4 : { assigned: 1, in_delivery: 2 }[o.status] || 3;
  const steps = back ? ['Récupérer', 'Livrer', 'Rendre'] : ['Récupérer', 'Livrer', 'Remettre'];
  const paid = o.driverPaid || 0;
  const head = `
    <div class="h-title">Ma course</div>
    <section class="card overflow-hidden">
      <div class="flex items-center gap-3 p-3.5">
        <img src="${imgSrc(o.photo)}" class="h-16 w-16 rounded-2xl object-cover" alt="">
        <div class="min-w-0 flex-1"><div class="truncate font-extrabold">${esc(o.name)}</div><div class="truncate text-xs text-mute">${esc(o.desc || o.id)}</div><div class="mt-1.5">${badge(o.status)}</div></div>
      </div>
      <ol class="grid grid-cols-3 border-t border-line text-center text-xs font-bold">
        ${steps.map((s, i) => { const n = back && i === 2 ? 4 : i + 1; return `<li class="flex items-center justify-center gap-1 py-2.5 ${n < step ? 'bg-emerald-50 text-emerald-700' : n === step || (back && i === 2) ? 'bg-night text-white' : 'text-slate-400'}">${n < step ? ic('check', 'h-3.5 w-3.5') : `<span>${i + 1}</span>`}${s}</li>`; }).join('')}
      </ol>
      ${paid ? `<div class="border-t border-line px-3.5 py-2.5 text-xs text-mute">Prime : <b class="text-ink">${fcfa(paid)}</b> reçus sur ${fcfa(o.driverNet)}${back ? `, plus ${fcfa(returnFeeOf(o))} de prime de retour à la remise` : ', le reste à la fin de la course'}</div>` : ''}
    </section>`;

  if (o.status === 'assigned') return head + `
    <section class="card space-y-4 p-4">
      ${routeBlock(o)}
      <div class="flex items-center gap-2 text-sm text-mute">${ic('calendarClock', 'h-4 w-4')}${esc(fmtSlot(o))}</div>
      ${sellerPhone(o) ? `<button class="btn btn-line w-full" data-action="call-seller" data-id="${o.id}">${ic('phone', 'h-4 w-4')} Appeler ${esc(o.shopName || o.sellerName)}</button>` : ''}
      <button class="btn btn-primary btn-lg w-full" data-action="pickup" data-id="${o.id}">${ic('packageCheck')} Colis récupéré chez le vendeur</button>
      <button class="btn btn-soft w-full text-sm" data-action="desist" data-id="${o.id}">${ic('undo', 'h-4 w-4')} Me désister de cette course</button>
    </section>`;

  if (o.status === 'in_delivery') return head + `
    <section class="card space-y-4 p-4">
      ${routeBlock(o)}
      <button class="btn btn-line w-full" data-action="call" data-id="${o.id}">${ic('phone', 'h-4 w-4')} Appeler le client ${o.client ? prettyPhone(o.client.wa) : ''}</button>
      <button class="btn btn-night btn-lg w-full" data-action="arrived" data-id="${o.id}">${ic('mapPin')} Je suis arrivé chez le client</button>
      <p class="text-center text-xs text-mute">Votre position est vérifiée à l'arrivée${o.client && o.client.geo ? ' : moins de ' + ARRIVAL_RADIUS_M + ' m du point du client' : ''}.</p>
    </section>`;

  if (o.status === 'return_to_seller') return head + `
    <section class="card space-y-4 p-4">
      <div class="rounded-2xl bg-orange-50 p-3.5 text-sm text-orange-900"><b>Ramenez le colis au vendeur.</b> ${o.returnReason === 'absent' ? 'Le client était absent.' : 'Le client a refusé l\'article.'} À la remise, le vendeur vous donne son code de retour.</div>
      ${routeBlock(o, true)}
      ${sellerPhone(o) ? `<button class="btn btn-line w-full" data-action="call-seller" data-id="${o.id}">${ic('phone', 'h-4 w-4')} Appeler ${esc(o.shopName || o.sellerName)}</button>` : ''}
      <h2 class="pt-1 text-sm font-bold text-mute">Code de retour du vendeur</h2>
      ${keypadHTML(o, 'return')}
    </section>`;

  if (o.status === 'refusal_pending') return head + `
    <section class="card space-y-4 p-5 text-center">
      <span class="mx-auto flex h-14 w-14 items-center justify-center rounded-full bg-rose-50 text-rose-600">${ic('packageX', 'h-7 w-7')}</span>
      <div class="text-lg font-extrabold">En attente du client</div>
      <p class="text-sm text-mute">Le client doit confirmer le refus (${esc(o.refusal ? o.refusal.note : '')}) depuis son téléphone. Restez sur place.</p>
      <button class="btn btn-primary w-full" data-action="client-back" data-id="${o.id}">${ic('userCheck', 'h-4 w-4')} Le client garde l'article, saisir son code</button>
      <p class="text-xs text-mute">Le client n'a pas de connexion ? Demandez-lui d'appeler SûrPay pour confirmer.</p>
    </section>`;

  if (o.status === 'absent_countdown') return head + `
    <section class="card space-y-4 p-5 text-center">
      ${o.absentContest ? `
        <span class="mx-auto flex h-14 w-14 items-center justify-center rounded-full bg-amber-50 text-amber-600">${ic('scale', 'h-7 w-7')}</span>
        <div class="text-lg font-extrabold">Absence contestée</div>
        <p class="text-sm text-mute">Le client dit ne voir aucun livreur. Le chrono est suspendu et SûrPay compare votre position et vos appels. Appelez le client.</p>` : `
        <div class="flex items-center justify-center gap-2 text-sm font-bold text-rose-600"><span class="pulse-dot h-2.5 w-2.5 rounded-full bg-rose-500"></span>Chronomètre officiel</div>
        <div class="amount text-[64px] leading-none text-night" data-countdown="${o.id}">${mmss(o.absentDeadline - Date.now())}</div>
        <p class="text-sm text-mute">Continuez d'appeler le client. À 00:00, vous ramenez le colis au vendeur et touchez votre prime complète plus la prime de retour.</p>`}
      <button class="btn btn-line w-full" data-action="call" data-id="${o.id}">${ic('phone', 'h-4 w-4')} Rappeler le client (${(o.calls || []).length} appels)</button>
      <button class="btn btn-primary w-full" data-action="client-back" data-id="${o.id}">${ic('userCheck', 'h-4 w-4')} Le client est là, saisir son code</button>
      ${DB.settings.testMode && !o.absentContest ? `<button class="mx-auto block text-xs font-semibold text-mute underline underline-offset-4" data-action="speed" data-id="${o.id}">Accélérer le chrono (mode test)</button>` : ''}
    </section>`;

  const mode = UI.driverMode[o.id];
  const calls = callsSinceArrival(o);
  const opt = (action, icon, tint, title, text, extra = '', disabled = false) => `
    <button class="flex w-full items-center gap-3 rounded-2xl border-2 p-3.5 text-left transition ${extra || 'border-line'} ${disabled ? 'opacity-50' : ''}" data-action="${action}" data-id="${o.id}">
      <span class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl text-white ${tint}">${ic(icon, 'h-5 w-5')}</span>
      <span class="flex-1"><span class="block font-extrabold">${title}</span><span class="block text-xs text-mute">${text}</span></span>
    </button>`;
  return head + `
    <section class="card space-y-3 p-4">
      <button class="btn btn-night w-full" data-action="call" data-id="${o.id}">${ic('phone', 'h-4 w-4')} Appeler ${o.client ? prettyPhone(o.client.wa) : 'le client'}${calls ? ` (${calls})` : ''}</button>
      ${o.client && o.client.hint ? `<div class="rounded-xl bg-surface px-3 py-2 text-[13px]"><span class="text-mute">Repère du client :</span> <b>${esc(o.client.hint)}</b></div>` : ''}
      <h2 class="pt-2 text-sm font-bold text-mute">Que se passe-t-il ?</h2>
      ${opt('opt-code', 'badgeCheck', 'bg-emerald-500', 'Livraison réussie', 'Le client a vérifié : saisir son code à 4 chiffres', mode === 'code' ? 'border-emerald-500 bg-emerald-50' : '')}
      ${mode === 'code' ? keypadHTML(o, 'code') : ''}
      ${opt('absent', 'timer', 'bg-ci', 'Client absent ou injoignable', calls >= MIN_CALLS ? `Démarrer le chrono de ${ABSENT_MIN} minutes` : `Appelez d'abord le client ${MIN_CALLS} fois (${calls}/${MIN_CALLS})`, '', calls < MIN_CALLS)}
      ${opt('refuse', 'packageX', 'bg-rose-500', 'Le client refuse l\'article', 'Photo du problème, le client confirme sur son téléphone')}
    </section>`;
}

    <section class="weave rounded-[26px] p-5 text-white shadow-[0_24px_48px_-24px_rgba(10,31,61,.9)]">
      <div class="text-sm text-white/70">Solde disponible</div>

/* ---------- Admin ---------- */
function adminMini(o, extra) {
  return `
    <div class="card space-y-3 p-3.5">
      <button class="flex w-full items-center gap-3 text-left" data-action="order-detail" data-id="${o.id}">
        <img src="${imgSrc(o.photo)}" class="h-12 w-12 rounded-xl object-cover" alt="">
        <div class="min-w-0 flex-1"><div class="truncate font-bold">${esc(o.name)}</div><div class="text-xs text-mute">${o.id}, ${esc(o.shopName || o.sellerName || '')}${o.client ? ', client ' + prettyPhone(o.client.wa) : ''}</div></div>
        <div class="amount text-sm">${num(o.total)}</div>
      </button>
      ${extra}
    </div>`;
}

function escrowHeld(o) {
  if (!o.paidAt || FINAL.includes(o.status)) return 0;
  return Math.max(0, o.price + o.fee - (o.driverPaid || 0) - refundedFor(o));
}

function adminOverview() {
  const escrow = DB.orders.reduce((s, o) => s + escrowHeld(o), 0);
  const sec = DB.ledger.filter((l) => l.type === 'security_fee').reduce((s, l) => s + l.amount, 0);
  const marg = DB.ledger.filter((l) => l.type === 'delivery_margin').reduce((s, l) => s + l.amount, 0);
  const refunds = DB.refunds.filter((r) => r.status === 'pending');
  const collected = DB.orders.filter((o) => o.paidAt).reduce((s, o) => s + o.total, 0);
  const inEscrow = DB.orders.filter((o) => escrowHeld(o) > 0).length;
  const users = Object.values(DB.users);
  const chk = checkIntegrity();
  return `
    <div class="h-title">Vue d'ensemble</div>
    <section class="weave rounded-[26px] p-5 text-white shadow-[0_24px_48px_-24px_rgba(10,31,61,.9)]">
      <div class="text-sm text-white/70">Fonds bloqués en séquestre</div>
      <div class="amount mt-1 text-[34px] leading-none">${num(escrow)} <span class="text-lg font-bold text-white/70">FCFA</span></div>
      <div class="mt-2 text-xs text-white/55">${inEscrow} commande${inEscrow > 1 ? 's' : ''} en cours. ${fcfa(collected)} encaissés au total.</div>
    </section>
    <div class="flex items-center gap-2 rounded-2xl p-3.5 text-sm font-semibold ${chk.ok ? 'bg-emerald-50 text-emerald-800' : 'bg-rose-50 text-rose-700'}">${ic(chk.ok ? 'shieldCheck' : 'shieldAlert', 'h-5 w-5')}${chk.ok ? `Registre des soldes intact (${DB.journal.length} mouvements vérifiés)` : 'Registre altéré : ' + esc(chk.reason) + ' Les retraits sont bloqués.'}</div>
    <section class="grid grid-cols-2 gap-2.5">
      <div class="card p-4"><div class="text-xs font-semibold text-mute">Commissions gagnées</div><div class="amount mt-1 text-xl">${fcfa(sec + marg)}</div><div class="mt-1 text-[11.5px] text-mute">2 % : ${num(sec)}<br>Marge livraison : ${num(marg)}</div></div>
      <div class="card p-4"><div class="text-xs font-semibold text-mute">À rembourser</div><div class="amount mt-1 text-xl ${refunds.length ? 'text-ci' : ''}">${fcfa(refunds.reduce((s, r) => s + r.amount, 0))}</div><div class="mt-1 text-[11.5px] text-mute">${refunds.length} remboursement${refunds.length > 1 ? 's' : ''} en attente</div></div>
    </section>
    <section>
      <h2 class="mb-3 text-base font-extrabold">Comptes (${users.length})</h2>
      ${users.length ? `<div class="card divide-y divide-line">${users.map((x) => `
        <div class="flex items-center gap-3 p-3">${avatar(x, 'h-9 w-9 text-xs')}
          <div class="min-w-0 flex-1"><div class="truncate text-sm font-bold">${esc(x.name)}</div><div class="truncate text-xs text-mute">${esc(x.email)}</div>${x.role && x.role !== 'admin' ? '<div class="mt-1">' + kycChip(x) + '</div>' : ''}</div>
          <div class="text-right text-xs">${x.role === 'seller' ? `<div class="font-bold">Solde ${num(x.gains)}</div><div class="text-mute">${sellerStats(x.uid).sales} ventes</div>` : x.role === 'driver' ? `<div class="font-bold">Solde ${num(x.wallet)}</div><div class="text-mute">${driverDelivered(x.uid)} courses${x.strikes ? ', ' + x.strikes + ' avert.' : ''}</div>` : `<div class="text-mute">${x.role === 'admin' ? 'Admin' : 'Sans rôle'}</div>`}</div>
        </div>`).join('')}</div>` : ''}
    </section>
    <section>
      <h2 class="mb-3 text-base font-extrabold">Toutes les commandes</h2>
      ${DB.orders.length ? `<div class="card divide-y divide-line">${DB.orders.map((o) => `
        <button class="flex w-full items-center gap-3 p-3 text-left" data-action="order-detail" data-id="${o.id}">
          <img src="${imgSrc(o.photo)}" class="h-10 w-10 rounded-lg object-cover" alt="">
          <div class="min-w-0 flex-1"><div class="truncate text-sm font-bold">${esc(o.name)}</div><div class="text-xs text-mute">${o.id}, ${num(o.total)} FCFA</div></div>
          ${badge(o.status)}
        </button>`).join('')}</div>` : '<div class="card p-6 text-center text-sm text-mute">Aucune commande.</div>'}
    </section>
    <section>
      <h2 class="mb-3 text-base font-extrabold">Journal de la plateforme</h2>
      ${DB.ledger.length ? `<div class="card divide-y divide-line px-4">${DB.ledger.slice(0, 15).map((l) => `
        <div class="flex items-center justify-between gap-3 py-3"><div class="min-w-0"><div class="truncate text-sm font-semibold">${esc(l.label)}</div><div class="text-xs text-mute">${fmtTime(l.at)}</div></div><div class="amount text-sm ${l.amount >= 0 ? 'text-emerald-600' : 'text-rose-600'}">${l.amount >= 0 ? '+' : '−'}${num(Math.abs(l.amount))}</div></div>`).join('')}</div>` : '<div class="card p-6 text-center text-sm text-mute">Aucune opération.</div>'}
    </section>`;
}
